 WESTERN_SENATE_CONSULS: "#E Roman Consul#!"
 WESTERN_SENATE_CONSUL_DESIGNATE: "#E Consul Nominee#!"
 WESTERN_SENATE_CONSUL_DESIGNATE_NONE_TOOLTIP: "The #V Roman Consul#! is elected yearly. If there is no designated successor to the Consulship, the Senate will select the next consul themselves. Elections are held in January, or when the previous Consul dies.\n\n[SelectLocalization(ObjectsEqual(GetTitleByKey('c_roma').GetHolder.GetTopLiege.GetTopLiege,GetPlayer),'$WESTERN_SENATE_CONSUL_DESIGNATE_ELECTION_I_RULE_ROME|q$','$WESTERN_SENATE_CONSUL_DESIGNATE_ELECTION_I_DO_NOT_RULE_ROME|q$')]"
 WESTERN_SENATE_CONSUL_DESIGNATE_ELECTION_I_RULE_ROME: "As you are the top liege of #V Roma#!, you have the ability to nominate a successor if you choose; this is accessible as a character interaction. You may select any man in your realm, or a Senator who resides in #V Roma#!. Alternatively, you may elect to leave the matter to the Senate, who will choose the next consul from among their own ranks.\n\n#weak Be warned that the Senate views interference with its prerogatives negatively, and reacts more strongly to the nomination of Barbarians, ill-educated Consuls, and non-Senators.#!"
 WESTERN_SENATE_CONSUL_DESIGNATE_ELECTION_I_DO_NOT_RULE_ROME: "The top liege of #V Roma#! may nominate a successor if they so choose, or may instead leave the matter to the Senate."
 WESTERN_SENATE_CONSUL_DESIGNATE_NONE_NAME: "None"
 every_west_senator: "Every Senator in the West ([EmptyScope.ScriptValue('number_of_west_senators_total')])"
