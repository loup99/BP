 ### Pseudo-Historical Mottos
 dynn_Constantinus_motto: "En toutōi níka"
 #Taken from Masties exhortation for Aures
 dynn_Masties_motto: "God gave his kindness to me"
 ### Various Easter Egg Mottos
 #This was randomly generated at some DD, but I found it too funny not to use; original English is "With the Sword, I seek Pleasure"
 dynn_Nepos_motto: "IN GLADIO VOLUPTATEM QUAERO"
 #Taken from Achebe's "Things Fall Apart", Chapter 14; this dynasty is based on the book
 igbo_dynn_igbo_motto: "A man can not rise beyond the destiny of his #italic chi#!"
 ### Pseudo-Historical Mottos
 dynn_Aghwank_motto: "Be Brave"
 #from Zosimus
 dynn_Arbogast_motto: "Neither Given My Command Nor Can Deprive Me Of It"
 #Royal formula of Parthian coinage
 dynn_Arsacid_motto: "Euergetou, dikaiou, epiphanous, philopatoros"
 dynn_Attilid_motto: "The Scourge of God"
 #from Victor Vitensis, trans. Moorhead
 dynn_Hazdigg_motto: "A King in Need of Revenue is a Great Trickster"
 #First Germanic king to mint coins
 dynn_Hemering_motto: "IVSSV RECHIARI REGES"
 #euro uelocius fugae subsidio, from Hydatius, trans. Muhlberger
 dynn_Masdring_motto: "More Swiftly than the Wind"
 dynn_Meroving_motto: "Long-Haired Kings"
 #Excerpt from the Great Inscription of Shapur I, trans. Soward
 dynn_Sassanid_motto: "That The Gods Have Made Us Their Ward"
 