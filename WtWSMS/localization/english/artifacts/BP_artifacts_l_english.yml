l_english:
 #Religious
 tooth_of_the_buddha: "Tooth of the Buddha"
 tooth_of_the_buddha_desc: "This is the tooth of Buddha that was once smuggled out of Kalinga. It is one of the most holy relics in existence from the Great Buddha and its custody requires the kingliest of qualities."
 branch_of_the_keshmar_cypress: "Branch of the Keshmar Cypress"
 branch_of_the_keshmar_cypress_desc: "Zoroaster himself planted a great cypress tree in the area of Keshmar at least a thousand years ago. The tree's magnificence and size are legendary, and these qualities can be clearly observed within this branch."
 nail_of_the_true_cross: "Nail of the True Cross"
 nail_of_the_true_cross_desc: "A nail of the cross Jesus was crucified upon. To possess such a fragment of the True Cross is tremendously prestigious!"
 gurzil_image: "Image of Gurzil"
 gurzil_image_desc: "A wooden statue of the war god Gurzil, in the form of a bull. To [GetFaithByKey('gurzil').GetAdjective] warriors, it is not only a holy icon but also a battle standard."
 
 #Roman
 western_roman_imperial_diadem: "Western Imperial Diadem"
 eastern_roman_imperial_diadem: "Eastern Imperial Diadem"
 roman_imperial_diadem_desc: "An elaborate jeweled crown in the Hellenistic style, fit only for a true heir to Rome."
 western_roman_regalia: "Western Roman Regalia"
 eastern_roman_regalia: "Eastern Roman Regalia"
 roman_regalia_desc: "The Imperial Regalia include various symbols displayed during processions of the Roman Emperor. The main items are various lances and spears along with a standard, which is an embroidered banner surmounted by a gold #italic aquila#!."
 