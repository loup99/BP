l_english:
 shahnameh_desc: "This massive tome tells, in exquisite verse and detail, the mythical history of the Persian Empire from the creation of the world until the present day. It seems to stir the heart of every Persian who reads it."
 artifact_wall_banner_kaviani: "This is the legendary Derafsh Kaviani — the royal standard of the Sassanid Empire. A symbol of identity and pride for the heirs of the Empire of Persia."
 artifact_sassanian_sword_description: "This sword $sassanian_sword_description_base$, making it a magnificent sight to behold. Though nowadays it is too fragile to be taken into battle, perhaps this sword was once held by a hero now lost to time?"