l_english:
 #Doctrines
 muhammad_succession_sunni_doctrine_desc: "It is the responsibility of the Ummah to appoint a rightful leader, both politically and religiously."
 muhammad_succession_shia_doctrine_desc: "Only through the house of the Prophet can the lineage of spiritual leadership be traced."
 muhammad_succession_muhakkima_doctrine_desc: "For an imam, rightful successor to Muhammad, to accept arbitration goes against the will of Allah! Only He can judge a suitable leader for us."
 
 #Faiths
 masmudi_desc: "A reformist branch of Sunni Islam that originated with the Amazigh tribes in northern Africa, the Almohadi movement saw themselves as unitarians and preached a doctrine of purified monotheism."
 
 # Events
 head_of_faith.0001.desc: "We [ROOT.Char.GetFaith.GetAdherentName] have chosen to follow the path of the Rashidun Caliphs, $head_of_faith.0000.desc$"
 head_of_faith.0011.desc: "[ROOT.Char.GetFaith.GetName] follows the infallible line of the #italic Ahl al-Bayt#, $head_of_faith.0000.desc$"
 warhorse.0002.d: "Zuljanah — a horse as selfless as any of the Sahabah!"
 fp3_frontier_story_cycle.0003_not_jizya: "We should have them pay an extra tax, for surely, you have been generous enough towards them?"\n\n"
 fp3_yearly.8051_islamic_zealots: "extinguished by infidel zealots, who broke into the temple and desecrated it in very creative ways."
 fp3_story_cycle_zanj_rebellion_events.0004.desc: "[zanj_leader.GetName], a notorious troublemaker, has appeared in Baghdad. [zanj_leader.GetSheHe|U] escaped Basra after a failed attempt at starting a revolt. The arrogant agitator purports to be part of the Prophet's house.\n\nThough these claims are ludicrous, my opponents might find it convenient to give them credence and have this upstart raising doubts on the legitimacy of my own rule."
 fp3_struggle.0100.desc.shia_and_zandaqa: "It was long accepted by Muslims that the Caliphate was the highest authority of this world, save God alone, but as the realm fell into despondency and decadence, it became apparent that the followers of the #italic Ahl al-Bayt#! had a better claim over the faithful.\n\nI have taken it upon myself to put the [struggle_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] Caliphate under my protection and vigilance. I shall usher in a new era of [ROOT.Char.GetFaith.GetAdherentName] dominance in the #EMP ummah#!, and our detractors would do well to fall in line!"