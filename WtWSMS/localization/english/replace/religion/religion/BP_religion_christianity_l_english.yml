l_english:
 #ethiopian_rite_desc: "The Early Christian Church did not have the same precise rubrics seen in later centuries, and a number of concurrent rites developed across the Roman Empire. While these rites were in doctrinal agreement with one another, it led to some noticeable behavioral and structural differences between the many rites in the East and West.\n\nIn Ethiopian, #italic Yäityop'ya Bēte Kirisitīyani#! (Ethiopian Christianity) was one such example. Formally established with the baptism of King Ezana, the Church is in communion with the Patriarch of Alexandria, although it maintains a number of distinct features, including a stricter adherence to Judaic laws."
 antiochian_rite_desc: "Branching from the See of Antioch, the Miaphysite Antiochene Church split from the Nicene Communion upon the elevation of Severus to the Patriarch. After Emperor Justinian deposed him, and the mostly Miaphysite Arameans continued supporting Severus and his successors. In communion with the Bishop of Alexandria, the Church is autocephalous."
