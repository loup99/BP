l_english:
 NOT_HAS_CULTURAL_PILLAR_THIRD: "[CULTURE.GetName|U] [culture|E] does not have the [CULTURE_PILLAR.GetName] [culture_pillar|E]"
 
 #Runestones
  culture_parameter_has_access_to_runestones: "[rulers|E] may raise stelae to commemorate certain major life events, earning [prestige_i][prestige|E] #weak (Before the #color_white $culture_era_high_medieval$#! [era|E])#!"
 raise_runestone_decision: "Raise [ROOT.Char.Custom('GetSteleName')]"
 raise_runestone_decision_desc: "[ROOT.Var('ancestor_to_bury').Char.Custom2('MyCharacterIntroduction', ROOT.Char)|U] has passed away. I will raise [ROOT.Char.Custom('GetASteleName')] to honor [ROOT.Var('ancestor_to_bury').Char.GetHerHis] life, and to bring fame to all who bear the name [ROOT.Var('ancestor_to_bury').Char.GetDynasty.GetName]. Future generations will never forget the greatness of [ROOT.Var('ancestor_to_bury').Char.GetFullNameNicknamedNoTooltip]!"
 raise_runestone_decision_tooltip: "Raise [ROOT.Char.Custom('GetASteleName')] to honor your [ROOT.Char.Custom2('RelationToMeShort', ROOT.Var('ancestor_to_bury').Char)]"
 raise_runestone_decision_warning: "@warning_icon! #X The monument will be destroyed if the [county|e] falls to someone outside of your [dynasty|E]#!"
 raise_runestone_decision_confirm: "$raise_stele_decision_confirm$"
 raise_runestone_decision_toast: "Raised [ROOT.Char.Custom('GetSteleName')]"
 raise_stele_decision_name: "$raise_runestone_decision$"
 raise_stele_decision_desc: "It is customary among the [GetPlayer.GetCulture.GetCollectiveNounNoTooltip] to erect carved monuments to commemorate important events. The death of a loved one, the settling of a dispute, the acquisition of land, and so on. Perhaps I could benefit from such a rock..."
 raise_stele_decision_tt.variable_strength: "All modifiers are stronger when erected in counties that share your language"
 raise_stele_decision_tooltip: "Pay for the carving of [ROOT.Char.Custom('GetASteleName')] in one of your counties"
 fp1_raise_runestone_vassals: "$EFFECT_LIST_BULLET$All [direct_vassals|E] that respect this practice"
 fp1_stele_ancestors_strong: "Ancestral Stele"
 fp1_stele_conquest_strong: "Conquest Stele"
 fp1_stele_promotion_strong: "Clout Stele"
 fp1_other_decisions.0101.desc: "Every [ROOT.Char.Custom('GetSteleName')] tells a message of some significant event in the life of the commissioner. From the smallest peasant to a [ROOT.Char.GetTitleAsNameNoTooltip] like myself, the stone records all.\n\nWhat shall this monument speak of?"
 fp1_other_decisions.0101.a.tt: "The [ROOT.Char.Custom('GetSteleName')] will speak of your departed family..."
 fp1_other_decisions.0101.b.tt: "The [ROOT.Char.Custom('GetSteleName')] will speak of your victories in conquest..."
 fp1_other_decisions.0101.c.tt: "The [ROOT.Char.Custom('GetSteleName')] will speak of how you came to rule..."
 fp1_other_decisions.0111.desc.intro: "Now that I have decided what to put on my [ROOT.Char.Custom('GetSteleName')], the question remains: where to place it?\n\n"
 # References to Islam and specific historical figures
 muhammad_succession_sunni_doctrine_desc: "It is the responsibility of the Ummah to appoint a rightful leader, both politically and religiously."
 muhammad_succession_shia_doctrine_desc: "Only through the house of the Prophet can the lineage of spiritual leadership be traced."
 muhammad_succession_muhakkima_doctrine_desc: "For an imam, rightful successor to Muhammad, to accept arbitration goes against the will of Allah! Only He can judge a suitable leader for us."
 head_of_faith.0001.desc: "We [ROOT.Char.GetFaith.GetAdherentName] have chosen to follow the path of the Rashidun Caliphs, $head_of_faith.0000.desc$"
 head_of_faith.0011.desc: "[ROOT.Char.GetFaith.GetName] follows the infallible line of the #italic Ahl al-Bayt#, $head_of_faith.0000.desc$"
 warhorse.0002.d: "Zuljanah — a horse as selfless as any of the Sahabah!"
 shahnameh_desc: "This massive tome tells, in exquisite verse and detail, the mythical history of the Persian Empire from the creation of the world until the present day. It seems to stir the heart of every Persian who reads it."
 fp3_frontier_story_cycle.0003_not_jizya: "We should have them pay an extra tax, for surely, you have been generous enough towards them?"\n\n"
 fp3_yearly.8051_islamic_zealots: "extinguished by infidel zealots, who broke into the temple and desecrated it in very creative ways."
 fp3_story_cycle_zanj_rebellion_events.0004.desc: "[zanj_leader.GetName], a notorious troublemaker, has appeared in Baghdad. [zanj_leader.GetSheHe|U] escaped Basra after a failed attempt at starting a revolt. The arrogant agitator purports to be part of the Prophet's house.\n\nThough these claims are ludicrous, my opponents might find it convenient to give them credence and have this upstart raising doubts on the legitimacy of my own rule."
 fp3_struggle.0100.desc.shia_and_zandaqa: "It was long accepted by Muslims that the Caliphate was the highest authority of this world, save God alone, but as the realm fell into despondency and decadence, it became apparent that the followers of the #italic Ahl al-Bayt#! had a better claim over the faithful.\n\nI have taken it upon myself to put the [struggle_liege.GetPrimaryTitle.GetNameNoTierNoTooltip] Caliphate under my protection and vigilance. I shall usher in a new era of [ROOT.Char.GetFaith.GetAdherentName] dominance in the #EMP ummah#!, and our detractors would do well to fall in line!"
 NOT_HAS_CULTURAL_PILLAR_THIRD: "[CULTURE.GetName|U] [culture|E] does not have the [CULTURE_PILLAR.GetName] [culture_pillar|E]"
