l_english:
 #476 bookmarks
 
 ##### WRE Bookmark #####
 bm_476_wre: "Denouement of an Empire"
 bm_476_wre_desc: "By the 460s, the Western Roman Empire had entered its terminal phase; by 476 Ravenna only controlled Italy proper and little else besides. Romulus #italic Augustulus#! sits on the throne, a mere puppet for his Father Orestes, while the other lands of the Western Part of the Empire remain under the control of Roman Rump states or Barbarian Kingdoms.\n\nDalmatia and Soissons remain the only two states of note under the control of Romans, while the Eastern Empire looks on, consumed by its own problems.\n\n#bold Will the young Romulus, guided by his ambitious father Orestes, somehow manage to salvage the situation? Will Nepos be able to leave Dalmatia and rise once more to be hailed as Augustus? Can Syagrius manage to convert his polity into something more permanent?\n\nOr is this the last gasps of the Western Roman Empire?#!"
 
 bm_476_wre_romulus_augustulus: "Romulus"
 bm_476_wre_romulus_augustulus_subheading: "#italic $hegemon_roman_government_male$#! of the Western Roman Empire"
 bm_476_wre_romulus_augustulus_desc: "Proclaimed as emperor by his father, Romulus Augustus was little more than a child thrust into Emperorship, unrecognized by the East. He, via the will of his father, usurped the Western Roman Empire, which had been crippled by centuries of strife and decline. With uprising of the barbarian general Odovacar threatening his already uneasy and short reign, what fate lies for the young emperor?\n\n#bold Can the child Emperor be the second coming of Romulus, or is his name a portent of the end of the [Glossary('Pars Occidentalis','PART_WEST_GLOSS')]?#!"
 bm_476_wre_romulus_augustulus_alt_orestes: "Orestes"
 bm_476_wre_romulus_augustulus_alt_orestes_desc: ""
 BOOKMARK_RELATION_FATHER_REGENT: "(Father and Regent)"
 
 bm_476_wre_julius_nepos: "Iulius"
 bm_476_wre_julius_nepos_subheading: "Despot of Dalmatia"
 bm_476_wre_julius_nepos_desc: "Julius Nepos, seen by the [Glossary('Pars Orientalis','PART_EAST_GLOSS')] as the last legitimate Western Roman Emperor, rules a small strip of land along the Dalmatian coast, following his ousting by the cunning Orestes.\n\nIn control of a small holdout, Julius gears up for an invasion to reclaim his rightful land - starting with the Italian Peninsula.\n\n#bold Will the true claimant succeed, or will the dreams of the [Glossary('Pars Occidentalis','PART_WEST_GLOSS')] die with him?#!"
 PART_EAST_GLOSS: "Literally \"Eastern Part\", referring to the Eastern Roman Empire."
 PART_WEST_GLOSS: "Literally \"Western Part\", referring to the Western Roman Empire."
 
 bm_wre_476_syagrius: "Syagrius"
 bm_wre_476_syagrius_subheading: "Despot of Soissons"
 bm_wre_476_syagrius_desc: "Syagrius, a Roman General, is the last Ruler of the Roman rump state centred on Soissons. Formally a #italic Dux#!, his Germanic neighbors have taken to referring to him as [Glossary('Rex Romanae','GLOSS_REX_ROMANAE')]. His political situation is precarious; to the South he faces the Arian Visigoths and Burgundians and to the North and West he faces the Germanic Franks and Alemannians.\n\n#bold Will Syagrius successful hold off the barbarians, or will the Germans successfully remove the last vestiges of Roman rule in Gaul?#!"
 GLOSS_REX_ROMANAE: "Latin for "King of the Romans"."
 
 bm_wre_476_emperor_basilicus: "Basiliscus"
 bm_wre_476_emperor_basilicus_subheading: "#italic $hegemon_roman_government_male$#! of the Eastern Roman Empire"
 bm_wre_476_emperor_basilicus_desc: "The Usurper Basiliscus sits unsteadily on the throne and is unable to intervene in the West. He usurped the throne from the Isaurian Barbarian Zeno, who has now gathered an army in Anatolia to remove Basilicus. Furthermore, Basilicus' strong Miaphysite sympathies alienate his staunchly Chalcedonian subjects, and the treasury lies empty. With an empty treasury, hostile subjects, and betrayal all around him, can Basiliscus successfully protect the empire not only from internal disorder but also external threats, should Persia turn its attention West?\n\n#bold Can Basilicus survive his perilous position, or will Zeno take the throne back?#!"
 
 ##### Western Barbarians Bookmark #####
 
 bm_476_western_barbarians: "The Germanic West"
 bm_476_western_barbarians_desc: "By 476, various Germanic and Amazigh polities were ascendent in Western Europe and the Mediterranean. The Vandals, the Burgundians, the Visigoths, and the Franks had all once been notional clients of Rome, but now they ruled portions of Roman territory. While #italic de jure#! recognizing Roman preeminence and maintaining at least some aspects of Roman governance, #italic de facto#! they had become fully independent kingdoms and principalities.\n\n#bold With the Western Empire almost certainly heading for extinction, how will these new \"Barbarian\"-led states shape history in the lands that once trembled when Rome spoke?#!"
 
 bm_476_western_barbarians_euric: "Euric"
 bm_476_western_barbarians_euric_subheading: "#italic $king_male_east_germanic$#! of the Visigoths"
 bm_476_western_barbarians_euric_desc: "The Visigoths have grown from mere #italic foederati#! in 418 to being the most powerful kingdom in what was once the [Glossary('Pars Occidentalis','PART_WEST_GLOSS')]. Euric stands atop this kingdom, having killed his own brother to gain the throne and defeating numerous foes to secure his rule. In 475, he forced Julius Nepos to recognize his independence from Rome.\n\n#bold Will Euric lead the Visigoths to greater successes, or will grasping for greater power lead to his downfall?#!"
 
 bm_476_western_barbarians_hermeric: "Hermeric"
 bm_476_western_barbarians_hermeric_subheading: "#italic $king_male_suebi$#! of the Suebi"
 bm_476_western_barbarians_hermeric_desc: "The Suebi, once contenders for control of Hispania, have been pushed to the northwestern portions of the peninsula by a series of Visigothic assaults on their kingdom. However, relations between the Visigoths have turned positive as of late, as the Suebi have embraced the Arian Christianity of their Gothic neighbors at the urging of the missionary Ajax; this conversion seems to have purchased the Suebi peace for a while. However, that peace is at a cost; the Suebi rule over a large number of Romano-Hispanic Pricillianists and Nicene Christians, and much of the Suebi population remains pagan.\n\n#bold Will Hermeric and his descendants recreate the glory of Rechiar's conquests, or are they destined to be sidelined and swallowed by other powers?#!"
 
 bm_476_western_barbarians_gundobad: "Gundobald"
 bm_476_western_barbarians_gundobad_subheading: "#italic $king_male_east_germanic$#! of the Burgundians"
 bm_476_western_barbarians_gundobad_desc: "The Burgundians have settled in #italic Sapaudia#! since 443. Gundobad has succeeded his uncle, Ricimer, to rule the Burgundians and is now beginning the process of consolidating his rule. With the deposition of Glycerius, Gundobad's favored Roman Emperor candidate, in 474, the Burgundians are now #italic de facto#! independent of Rome.\n\n#bold Surrounded by hostile forces, can Gundobad secure the independence of the Burgundians, or will upstarts conquer their kingdom?#!"
 
 bm_476_western_barbarians_arbogast: "Arbogast"
 bm_476_western_barbarians_arbogast_subheading: "#italic Comes#! of Augusta Treverorum"
 bm_476_western_barbarians_arbogast_desc: "In #italic Augusta Treverorum#! a Romanized Frank rules. A descendant of Arbogast the #italic Magister Militum#!, he has been praised by both Sidonius Apollinaris and Auspicius of Toul as one of the last defenders of the Western Empire and Roman culture.\n\nThe precise nature of his polity and its relations to the Franks is unknown, but it is known that around Trier, Frankish-style graves are nearly absent prior to the VIth century. As such, the #italic $county_roman$#! of #italic Augusta Treverorum#! may represent the transition from the disintegration of Roman rule along the Rhine to the establishment of Frankish control in the region.\n\n#bold Can Arbogast match the achievements of his pagan ancestor, or will the various Germanics surrounding him swallow #italic Augusta Treverorum#! whole?#!"
 
 bm_476_western_barbarians_masties: "Masties"
 bm_476_western_barbarians_masties_subheading: "#italic $duke_male_berber_group$#! of Aures"
 bm_476_western_barbarians_masties_desc: "Masties, a self-styled #italic Dux#!, rules a polity of mixed Roman and Amazigh peoples near the Aures mountains. Bolstered by mainstream Christians and schismatic Donatists fleeing Vandal persecution, Masties' pro-Roman outlook is unique among the post-Roman states of Africa.\n\nThe appeal \"God gave his kindness to me\" resonates well with Roman sensibilities in a post-Constantinian world. He finds giving tribute to the Vandals a burden, and long seeks to break truly free from their grasp.\n\n#bold Will Masties be able to create a new, independent state for the Romans and the Moors, or is he doomed to be subjugated fully by the Vandals?#!"
 
 bm_476_western_barbarians_gaisaric: "Gaisareiks"
 bm_476_western_barbarians_gaisaric_subheading: "#italic $king_male_vandal_all_king$#! of the Vandals and Alans"
 bm_476_western_barbarians_gaisaric_desc: "At 87 years old, the once-mighty Gaisareiks is not long for this world. Immensely capable, it remains to be seen whether his heir Hunireiks will be capable of holding the twin crowns of the Vandals and Alans, given how strategically positioned the Vandals are.\n\nGaisareiks' eldest son, Hunireiks, is not like his father; he lacks the prestige and force of will and personality that let Gaisareiks lead the Vandals from Hispania to Africa and take the third most important city in the Empire. And the zealous Arianism of the Vandals clashes strongly with the divided Christianity over which they rule.\n\n#bold Can Gaisareiks live long enough to secure Africa for his son, or will succession bring problems for the next King of the Vandals and Alans?#!"
 bm_476_western_barbarians_gaisaric_alt_huneric: "Hunireiks"
 bm_476_western_barbarians_gaisaric_alt_huneric_desc: ""
 
 bm_476_western_barbarians_childeric: "Childeric"
 bm_476_western_barbarians_childeric_subheading: "#italic $duke_male_old_frankish$#! of the Salian Franks"
 bm_476_western_barbarians_childeric_desc: "Childeric ruled over the Salian Franks from 457 to 481. While known best individually for his valor as he fought alongside Soissons in order to drive back the Visigoths in 463, he is more commonly remembered as the father of Clovis, a promising young man with a bright and gleaming future..."
 bm_476_western_barbarians_childeric_alt_clovis: "Clovis"
 bm_476_western_barbarians_childeric_alt_clovis_desc: ""
 
 ##### Goths Bookmark #####
 bm_476_goths: "The Germanic East"
 bm_476_goths_desc: "While the Western Part of the Empire has shattered under successive waves of Germanic migrations, the East remains far from stable. Goths have become a fixture of Rome's military apparatus, starting under the Alanic-Gothic Aspar and continuing under the influence of the Thracian Goths under $T_iudareiks$ #italic Strabo#!. The recently arrived Amaling Goths under $T_iudareiks$ threatens to upset the balance of power along the lower Danuvius, where they are nestled between the other Goths. And beyond the Danuvius lies the Gepids, who have blossomed into a mighty nation centered on Sirmium.\n\n#bold Will the Eastern Empire weather these Germanics, or is this just the first inklings of the disintegration of the East?#!"
 STRABO_GLOSS: "Greek for \"Squinter\", likely referring to distorted or crooked eyes."
 DANUVIUS_GLOSS: "Latin term for the Danube."
 
 bm_476_goths_theodoric_amaling: "$T_iudareiks$"
 bm_476_goths_theodoric_amaling_subheading: "#italic $king_male_east_germanic$#! of the Eastern Goths"
 bm_476_goths_theodoric_amaling_desc: "The most recent arrivals to the Danubian frontier, the Amaling Goths fled the poverty of Pannonia and, after excursions in the Balkans, have joined their Gothic brethren in the Lower Danube. $T_iudareiks$, once a hostage of Emperor Leo, has been blessed with a Roman education and is long-wise in the ways of Roman intrigue. He was recently granted honors from then-Emperor Zeno, making him in many ways the more prestigious of the two like-named Goths.\n\n#bold Will $T_iudareiks$ continue to rise in stature in their new home along the Lower Danube, or are there great intrigues afoot?#!"
 
 bm_476_goths_theodoric_strabo: "$T_iudareiks$ 'Strabo'"
 bm_476_goths_theodoric_strabo_subheading: "#italic $duke_male_east_germanic$#! of the Thracian Goths"
 bm_476_goths_theodoric_strabo_desc: "$T_iudareiks$, son of Triarius, is the preeminent Germanic power south of the [Glossary('Danuvius','DANUVIUS_GLOSS')]. $T_iudareiks$ led a revolt in the aftermath of Aspar's death, using his influence in the Roman military to depose Zeno and install Basilicus, only to have Basilicus grant the #italic Magister Militum#! position to Armatus, whom $T_iudareiks$ hated. With a new civil war afoot in Eastern Rome, $T_iudareiks$ has sat by, content to let the Romans kill each other.\n\n#bold Will $T_iudareiks$ [Glossary('#italic Strabo#!','STRABO_GLOSS')] bring the Goths to ever greater glory, or will his hopes be dashed by forces, internal or external?#!"
 
 bm_476_goths_andag: "Andag"
 bm_476_goths_andag_subheading: "#italic $duke_male_east_germanic$#! of the Goths"
 bm_476_goths_andag_desc: "Andag leads a mixed band of Sarmatians, Skirians, and Goths in Scythia Minor, and it was he who slew the Visigoth $T_iudareiks$ at the Battle of the Catalaunian Plains in 451, fighting alongside Attila. Now dependent on Roman patronage, this band is part of the bulwark that holds the Huns and other barbarians away from Roman lands.\n\n#bold With the arrival of the Amalings and Rome's attention beginning to turn northward, can this open a space for Andag's band to establish themselves, or will their destiny only fill a paragraph or two in some book?#!"
 
 bm_476_goths_thrapstila: "$Thrapstila$"
 bm_476_goths_thrapstila_subheading: "#italic $king_male_east_germanic$#! of the Gepids"
 bm_476_goths_thrapstila_desc: "Following the Battle of Nedao in 454, the Hunnic Empire disintegrated, leading to its vassals breaking free and establishing their own polities. The once-loyal Gepids, settling in the upper reaches of the Tisza and Sava rivers.\n\nDespite the Ostrogothic victory against the combined Gepid, Skirian, and Sarmatians, the Ostrogoths won and became the preeminent power in Pannonia and the Middle Danbue, only to leave the region shortly thereafter. In this vacuum, the Gepids have expanded, securing Sirmium a mere three years ago and becoming one of the major players in the Middle Danube region.\n\n#bold Under the reign of the ruler $Thrapstila$, will the Gepids continue to enjoy the wealth their domination of the Danube brings, or will they catapult to greater heights even now?#!"
 
 ##### Adventurer Bookmark #####
 
 bm_476_adventurers: "Usurpers and Legitimists"
 bm_476_adventurers_desc: "The Fall of the Western Empire was a time of great change and upheaval, in both the East and the West. Odovacar led his band of federates against Orestes and his puppet Emperor Romulus, seeking the roof-trees the federates so strongly desired. In the East, the once-deposed Isaurian, Zeno, has now rallied and seeks to unseat the usurper Basilicus. In both Rome's Orient and the Occident, the throne and nature of the Empire is in flux.\n\nBut these two are not the only wandering men with stories to tell; elsewhere men of great vision or standing are seeking to make their fortunes or otherwise secure their own posterity and prosperity.\n\n#bold Will they be able to leave a mark on history, or will they merely be a paragraph or two in some prosopography?#!"
 
 bm_476_adventurers_odoacer: "Odovacar"
 bm_476_adventurers_odoacer_subheading: "Leader of the Western Roman #italic Foederati#!"
 bm_476_adventurers_odoacer_desc: "Odovacar is a citizen and general of Rome, and is the commander of a Germanic #italic Foederati#!. When the #italic foederati#! were denied lands in Italy, Odovacar led them against Romulus [Glossary('Augustulus','GLOSS_AUGUSTULUS')], displacing the boy emperor and founding the Kingdom of Italy. Thoroughly an integrated Roman citizen, his efforts were met with praise and reward from Zeno, the Emperor-in-the-East, as he was allowed to govern Italy as an independent Roman province. However, left without the support of the Eastern Roman Empire, Odovacar must meet the threats that for so long had destabilized the Western Roman Empire.\n\n#bold Can Odovacar secure a place for his people, like other Germanic conquerors, or will he fail where Alaric and Gaiseric succeeded?#!"
 GLOSS_AUGUSTULUS: "Diminutive of 'Augustus'; can be read as 'little Augustus', in reference to Romulus' youth or his status as his father's puppet"
 
 bm_476_adventurers_emperor_zeno: "Zeno"
 bm_476_adventurers_emperor_zeno_subheading: "Claimant to the Eastern Roman throne"
 bm_476_adventurers_emperor_zeno_desc: "Zeno, born an Isaurian named Tarasis, would reign as the Emperor of the Eastern Roman empire during a period filled of religious turmoil and unrest. After losing the title of emperor to a palace coup, he initiated a war to regain his lost empire against the Miaphysite Emperor Basiliscus. Although, even with victory here, more threats must still be faced. Hordes of Germanic barbarians roam the empire, causing unrest and chaos, while Persia merely waits for their next chance to finish Constantinople.\n\n#bold Can Zeno reclaim the throne and prove to New Rome that he is more than just an Isaurian barbarian?#!"
 
 bm_476_adventurers_hormidak: "Hormidak"
 bm_476_adventurers_hormidak_subheading: "Leader of a Hunnic band"
 bm_476_adventurers_hormidak_desc: "The collapse of the Hunnic Empire in the wake of Atilla's death led to a splintering of the Huns and numerous Hunnic groups arose in the aftermath.\n\nOne of these was led by a Hun named Hormidak. He is noted for capturing Serdica in the winter of 466 before eventually being forced from the city by the future Western Emperor Anthemius, who, despite seeing cavalry officer defect, managed to defeat Hormidak. The Huns were allowed to leave under the flag of truce after the defector was put to death in front of both armies.\n\nSince then, not much has been heard about Hormidak, whose fate after facing Anthemius is lost to history.\n\n#bold Will Hormidak simply disappear into the wild lands beyond Rome, or is he planning a comeback?#!"
 
 bm_476_adventurers_vidimir: "Withemir"
 bm_476_adventurers_vidimir_subheading: "Leader of a contingent of Pannonian Goths"
 bm_476_adventurers_vidimir_desc: "Just a few years ago, the eastern Goths were masters of Pannonia, with the various Amaling sons of Wandalar ruling a portion. But Pannonia was poor, too poor to support the growing numbers of Goths, and the former Gothic Pannonian Kingdom has been split.\n\nThe well-known $T_iudareiks$ ruled the main contingent, but another component left Pannonia under the command of $T_iudareiks$' uncle Withemir and invaded Italy in 473. By providing many gifts Withemir was convinced to leave Italy and go to Gaul, where Withemir now resides.\n\nWithemir died in 474, leaving this host to his son, also named Withemir. He is now living in the Visigothic Kingdom and has two choices: either unite with his kinsmen in Tolosa, or use it as a springboard for greater ambitions?\n\n#bold Will Withemir choose a path that lets him fade from history, or can he rival the achievements of his more famous cousin?#!"
 bookmark_476_theodoric: "$T_iudareiks$"
 
 ##### Caucus Bookmark #####
 bm_476_caucuses: "Battleground of Cultures"
 bm_476_caucuses_desc: "The Caucasus have long been the cross-roads between different cultures, and this period is no exception. While Persia retains nominal overlordship of Georgia, Armenia, and Aghwank, the #italic Shahanshah's#! grip on the region is beginning to slip. The aftermath of the Battle of Avarayr in AD 451 has exhorted concessions from the empire, legalizing the churches within its borders.\n\nThis peace was hard-won, but it is a fragile truce resting upon deeper tensions. With the martyrdom of the Armenian queen Shushanik, Christians of all ranks are beginning to find Zoroastrian #italic Marzbans#! intolerable.\n\n#bold Can Peroz maintain a hold on the Caucasian statelets, or will it prove to be too difficult to rule the people of the hills?#!"
 
 bm_476_caucuses_vachagan: "Vachagan III"
 bm_476_caucuses_vachagan_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_476_caucuses_vachagan_desc: "During the dynastic struggle between Peroz and Hormizd III, King Vache II of [Glossary('Aghwank','AGHWANK_GLOSS')] attempted to declare independence. Ultimately unsuccessful, Vache was forced to abdicate. The throne of Albania has been left empty, its fate uncertain. \n\n#bold A staunch Christian in his time, can Vachagan earn his title as a pious king, or will he remain a puppet, crowned in name only?#!"
 bm_476_caucuses_hazkert: "Hazkert"
 bm_476_caucuses_vache_ii: "Vache II"
 
 bm_476_caucuses_varsken: "Varsken"
 bm_476_caucuses_varsken_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_476_caucuses_varsken_desc: "#italic Bidaxsh#! Varsken of Gugark, recently converted to Zoroastrianism, the faith of his ancestors and the faith of his #italic Shahanshah#!, Peroz. As a reward for his fealty, Varsken wed the daughter of Peroz I, binding his house more closely to the Sassanid Throne.\n\nHowever, this was not his first marriage; he was previously wed to Shushanik, daughter of Vardan Mamikonian. When she refused to abandon Christianity, he tortured and killed Shushanik. This murder earned him the enmity of not only the Mamikonians, but all the Christian rulers of the Caucasus.\n\n#bold Will Varsken's actions guide him to glory, or will his enemies crush him for his hubris?#!"
 
 bm_476_caucuses_vakhtang: "Vakhtang"
 bm_476_caucuses_vakhtang_subheading: "#italic $king_georgian_male$#! of Iberia"
 bm_476_caucuses_vakhtang_desc: "Vakhtang of the Chosroid House of the Mihran Dynasty, has brought glory to his house and served his Sassanid suzerain well, participating in campaigns in both the East and West and wedding the daughter of Hormizd III.\n\nHowever, circumstances in the Caucasus are beginning to shift. As time goes on, Vakhtang is adopting a more pro-Roman orientation; he recently negotiated the elevation of the Georgian Church to autocephaly and has oriented it in favour of the theological positions held in Constantinople. The recent execution of Shushanik Mamikonian has roused his anger and he may well plot against his suzerain soon.\n\n#bold Will the Wolf-Head free Iberia from Persian shackles, or will his dreams of independence be crushed?#!"
 
 bm_476_caucuses_adhur: "Adhur"
 bm_476_caucuses_adhur_subheading: "#italic Marzban#! of Armenia"
 bm_476_caucuses_adhur_desc: "Adhur Gushnasp, #italic Marzban#! of Armenia, lies in a precarious position. He, a Zoroastrian, rules over a large population of Christians in the name of his liege Peroz I.\n\nA mere 25 years ago, the Christians revolted and managed to inflict a Pyhrric victory upon the Persians, securing freedom of religion. But that appears to have been a temporary truce, as Christian resentment of infidel rule extends not only the peasants, but the Christian nobility as well.\n\n#bold Will Adhur managed to hold on to his #italic Marzbanate#!, or will simmering tensions force him from his golden throne?#!"
 
 bm_476_caucuses_sahak: "Sahak"
 bm_476_caucuses_sahak_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_476_caucuses_sahak_desc: "Sahak Bagratiuni, one of the first rulers of what would become the prestigious Bagratuni Dynasty, first emerged as #italic nakharars#! during the Arshakuni dynasty as hereditary #italic aspets#!, or Masters of the Horse. Since the martyrdom of Saint Shushanik, tensions between the Christian Armenians and their Zoroastrian rulers are reaching a boiling point.\n\n#bold Will Vassak help throw off the shackles of infidel rule over Armenia, or will he find a different path?#!"
 
 bm_476_caucuses_vahan: "Vahan"
 bm_476_caucuses_vahan_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_476_caucuses_vahan_desc: "Vahan Mamikonian, nephew of the great Saint Vardan Mamikonian and cousin of the martyred Shushanik, desires vengeance upon Zoroastrians in general and Varsken in particular.\n\nArmenians continue to chaff under infidel rule and it is a matter of time until the whole kingdom is in open revolt.\n\n#bold Will Vahan end the rule of the infidels and avenge his murder family, or will the Sassanid yoke grow ever more oppressive?#!"
 
 bm_476_caucuses_mihr: "Mihr"
 bm_476_caucuses_mihr_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_476_caucuses_mihr_desc: "The head of the Caucasian Mihranid House is in a precarious position: he shares the faith of the people, but not their customs; he shares the customs of his suzerain, but not his faith. Both Armenians and Eranians view him with distrust.\n\nThe recent execution of Shushanik Mamikonian has now heightened these differences as the Caucasus appears to be shaping up for a conflagration.\n\n#bold When the inevitable occurs, where will Mihr's loyalties lie? With his culture or his faith?#!"
 
 bm_476_caucuses_vache: "Vache"
 bm_476_caucuses_vache_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_476_caucuses_vache_desc: "Vache, of the ancient and distinguished Arcruni Dynasty, rules the territories south of Lake Van. While the dynasty has embraced Christianity in the times since Meruzhan Arcruni, it remains strongly favouring Persia, unlike other Christian rulers in Armenia.\n\nThe dynasty now stands at a crossroads as cultures and faiths collide in the Caucasus.\n\n#bold Which way will Vache turn his dynasty: to the Roman Occident or the Persian Orient?#!"
 
 bm_476_caucuses_gelehon: "Gdihon"
 bm_476_caucuses_gelehon_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_476_caucuses_gelehon_desc: "Gdihon is the grandson of Vasak Siak, who renounced Christianity and joined with the Sassanids during the Armenian Revolt of AD 450-451. Vasak's callousness, failures, and deception during the revolt led to his dismissal as #italic Marzban#! of Armenia and his imprisonment in Ctesiphon.\n\nGelehon now rules over Syunik, surrounded by infidels with few fellow Zoroastrians to assist him.\n\n#bold Will Gdihon's rule in Syunik help remove the stain of Vasak's failures from the dynasty, or does the Siak dynasty have further to fall?#!"
 
 bm_476_caucuses_damnazes: "Damnazes"
 bm_476_caucuses_damnazes_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_476_caucuses_damnazes_desc: "Damnazes, King of Lazica, remains firmly under Rome's thumb, a condition his Mazdan loyalties find repugnant, even as his people and his own father readily embraced Christ. Buffered from most of the barbarians by Sarir and Zichia, Damnazes' greatest threat is Rome.\n\n#bold Will Damnazes successfully lead his people back to independence and his faith, or will they be swallowed by Rome in body and soul?#!"
 
 bm_476_caucuses_artavan: "Artavan"
 bm_476_caucuses_artavan_subheading: "$BOOKMARK_SUBHEADING_DEFAULT$"
 bm_476_caucuses_artavan_desc: "With the fall of the Arsacid dynasty in Armenia, some of the remaining princes fled to the Roman empire, wherein they possess some holdings still within Roman territory. Artavan is the head of the Arascids (or #italic Arshakuni#! in Armenian) and it is from his line that the later Armenian general Artabantes will lead Armenian troops during the reconquest of Africa.\n\n#bold Can Artavan reverse the fortunes of the Arshakuni dynasty, or will they end their history as servants of Rome?#!"
 
 ##### Post-WRE Bookmark #####
 bm_476_shattered_empire: "Shattered Empire"
 bm_476_shattered_empire_desc: "Odovacar destroyed the Western Roman Empire in Italy by deposing the puppet Emperor Romulus. With Romulus' deposition, the Senate sent the imperial insignia to Zeno, indicating that they no longer saw the need for two Emperors; contemporaneously, he received an envoy from Julius Nepos asking for money and an army to resume control of Italy. Zeno instead took the middle road, telling the Senate to accept Nepos back and that Odovacar should accept Nepos' authority, but took no substantive effort to carry out the suggestion.\n\nThe situation in the East is likewise tenuous; while Zeno was welcomed to Constantinople with the support of the Senate, he is still considered a Barbarian by the people and the Isaurians he used to reclaim the throne expect to be rewarded for their efforts. Beyond the internal intrigues, the Sassanids continue to stare at Rome, eager to secure control over the entirety of the Caucasus at last.\n\n#bold Both halves of the empire stand at a knifes edge; will internal dissention or external forces force them to collapse, or can the leaders of the East and West carve a path to stability?#!"
 odoacer_peace_visigoths: "Odovacar's Peace with the Visigoths"
 odoacer_peace_vandals: "Odovacar's Peace with the Vandals"
 odoacer_peace_wre: "Odovacar's Peace with the Western Roman Empire"
 
 bm_476_shattered_empire_odoacer: "Odovacar"
 bm_476_shattered_empire_odoacer_subheading: "#italic Rex#! of Italia"
 bm_476_shattered_empire_odoacer_desc: "Having killed the Usurper Orestes and deposed Romulus Augustulus, Odovacar stands atop the new #italic Regnum Italiae#! with the blessing of the Eastern Empire. Under Zeno's advice, Odovacar pays lip service to Nepos as Emperor of the West, but otherwise ignores the impotent ruler of Dalmatia.\n\nHe has successfully pulled off a pair of diplomatic coups: securing peace with the Visigoths to the West and securing Sicily and peace with the Vandals.\n\nBut for how much longer can his position be safe? The Rugii in Noricum are becoming restless, the Alamanni of Raetia are likewise beginning to flex their muscles. Even with Zeno's blessing, there are those who view him as an upstart and tyrant like Orestes, even within Italia.\n\n#bold Can Odovacar keep the kingdom he has secured for his federates, or will others come and displace him?#!"
 
 bm_476_shattered_empire_emperor_zeno: "Zeno"
 bm_476_shattered_empire_emperor_zeno_subheading: "#italic $hegemon_roman_government_male$#! of the Eastern Roman Empire"
 bm_476_shattered_empire_emperor_zeno_desc: "Having displaced and executed the usurper Basilicus and his kin, Zeno enjoys the current support of the Roman people. However, the situation is far from secure; he has stopped the most immediate threats, but religious tensions fill the rich provinces of #italic Oriens#! and #italic Aegyptus#!, and the Caucasian situation is always in flux, especially as his tributary Damnazes has embraced Zoroastrianism. Once the luster of having having a Chalcedeonian on the throne wears off, Romans are liable to remember Zeno's barbarian heritage.\n\n#bold How will the once and current Emperor guide Rome? To peace and prosperity? Or is this just a calm before the storm?#!"
 
 bm_476_shattered_empire_peroz: "Peroz"
 bm_476_shattered_empire_peroz_subheading: "#italic $hegemon_iranian_dynastic_male$#! of the Iranians"
 bm_476_shattered_empire_peroz_desc: "Peroz's reign as been marked by constant tensions and conflagrations: the revolts in [Glossary('Aghwank','AGHWANK_GLOSS')] and Armenia in the 450s, the war with the Kidarites in the 460s, and a recent campaign agaisnt the Hepthalites which ended in a humiliating ransom which the deposed Emperor Zeno paid for him. Furthermore, Rome's tribute for the protection of the Caucasus halted after Zeno was deposed, and the Roman envoys are making entreaties about the status of the city of Nisbis.\n\n#bold With every border under pressure, can the King of Kings prevent #italic Ērān#! from falling under the rule of the #italic Anērāns#!?#!"
 
 bm_476_shattered_empire_julius_nepos: "Iulius"
 bm_476_shattered_empire_julius_nepos_subheading: "#italic $hegemon_roman_government_male$#! of the Western Roman Empire"
 bm_476_shattered_empire_julius_nepos_desc: "With the agreement of the Emperor of the East, Nepos has been recognized as the Emperor of the West, at least in name. But for all practical purposes, he is even less of an emperor than the boy Romulus was; he controls no lands in Italia and Odovacar pays only the simplest lip service to his rank. The situation is intolerable, and Dalmatia is hardly a safe location, for some barbarian group will fill the vacuum left by the Hunnic Empire in Pannonia eventually.\n\n#bold Can the once and current Emperor of the West reestablish the might of Rome, or is he doomed to die, taking the dreams of Rome with him?#!"
 