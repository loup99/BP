l_english:
 #Modifiers
 VIET_greek_mythology_thoughts: "Contemplating Classical Myths"
 VIET_greek_mythology_thoughts_desc: "The ancient Greco-Roman myths fascinate this character."
 VIET_gods_curse: "Cursed by the Gods"
 VIET_gods_curse_desc: "Every misfortune this character suffers is the work of divine retribution."
 VIET_zeus_blessing: "Blessed by Zeus"
 VIET_zeus_blessing_desc: "This character has shown #italic xenia#! to an unlikely guest."
 VIET_played_with_nymphs: "Played with Nymphs"
 VIET_played_with_nymphs_desc: "This character claims to have met with and spent some time with nymphs, those mirthful, mischievous, female spirits."
 VIET_curse_tablet: "Target of Curse Tablet"
 VIET_curse_tablet_desc: "Woe! Someone has used a curse tablet to target this character."
 VIET_hellenic_helped_maid: "Friend to True Love"
 VIET_hellenic_helped_maid_desc: "This kindly character has helped a servant find a young lover of honorable and gentle disposition who will treat them well."
 VIET_hellenic_helped_servant: "Towards True Love"
 VIET_hellenic_helped_servant_desc: "This servant has received aid from their liege in pursuing true love."
 VIET_nymph_protector: "Protected by Powerful Nymph"
 VIET_nymph_protector_desc: "Legend has it that a powerful nymph resides in this province, blessing it with prosperity and security, for she was the lover and wife of a lord who once ruled here ages ago."
 VIET_rumored_nymph: "Rumored to be a Nymph"
 VIET_rumored_nymph_desc: "They say that this pretty woman is actually a nymph masquerading as a mortal."
 VIET_fanatic_tree: "Fanaticus"
 VIET_fanatic_tree_desc: "On this character's residence is a so-called "fanaticus." These trees have been struck by lightning and are therefore blessed."
 VIET_hades_blessing: "Blessed by Hades"
 VIET_hades_blessing_desc: "The mortals tend to forget that Hades is not only the god of the dead, but also the god of wealth."
 VIET_persephone_blessing: "Blessed by Persephone"
 VIET_persephone_blessing_desc: "Persephone. On one hand, the Dread Iron Queen of the underworld brave Odysseus feared more than even Hades; on the other innocent Kore, the rosy-cheeked maiden of springtime."
 VIET_aphrodite_blessing: "Praised Aphrodite"
 VIET_aphrodite_blessing_desc: "For rightfully recognizing her as the fairest goddess, Aphrodite granted the hand of Helen to Paris."
 VIET_hera_blessing: "Praised Hera"
 VIET_hera_blessing_desc: "Hera offered to sate Paris' ambition with the crown of all Eurasia, an offer he so cruelly rejected."
 VIET_athena_blessing: "Praised Athena"
 VIET_athena_blessing_desc: "Though a virgin goddess, Athena promised wisdom in the martial arts if Paris were to flatter her."
 VIET_hermes_blessing: "Herma Builder"
 VIET_hermes_blessing_desc: "This character has constructed a herma, an apotropaic statue."
 VIET_priapus_blessing: "Priapus"
 VIET_priapus_blessing_desc: "The ancient Latins and Hellenes looked down on those with large phalluses... except when it came to Priapus."
 VIET_priapus_curse: "Cursed by Priapus"
 VIET_priapus_curse_desc: "They say this character has been cursed by the god Priapus. Maybe that's why they have been unable to perform as adequately in bed..."
 VIET_lars_diplomacy: "Blessings of the Lares (Diplomacy)"
 VIET_lars_martial: "Blessings of the Lares (Martial)"
 VIET_lars_stewardship: "Blessings of the Lares (Stewardship)"
 VIET_lars_intrigue: "Blessings of the Lares (Intrigue)"
 VIET_lars_learning: "Blessings of the Lares (Learning)"
 VIET_not_convinced_Zeus: "Met an Adultress Supposedly Impregnated by Zeus"
 VIET_not_convinced_Zeus_desc: "All the adultresses these days use Zeus as an excuse."
 VIET_convinced_Zeus: "Met a Woman Impregnated by Zeus"
 VIET_convinced_Zeus_desc: "Even after all these centuries and millennia, the king of gods doesn't seem to have any self-control!"

 VIET_nyx_devotee: "Blessed by Nyx"
 VIET_nyx_devotee_desc: "Ever shall this house throughout the circling periods of the year hold thee high in honour and in worship."
 VIET_aphrodites_dream_blessing: "Blessed by Aphrodite"
 VIET_aphrodites_dream_blessing_desc: "Aphrodite of the Myrtle, Aphrodite the Changer of Hearts, Aphrodite the Heavenly — she who is the goddess of beauty and love has bestowed her favor."
 VIET_epona_statue: "Epona Statue"
 VIET_epona_statue_desc: "One of the towns in this province recently dedicated a new statue to the Gallo-Roman deity Epona, the goddess of horses, donkeys, and fertility."
 VIET_ceres_hanging: "Hanging for the Harvest"
 VIET_ceres_hanging_desc: "A farmer attempted to curse his neighbor's crops, and was hung for this crime. Locals using dark magic, offending gods and mortals alike, is cause for suspicion."
 VIET_glaucus_herb: "Glaucus Herb"
 VIET_glaucus_herb_desc: "Some superstitious locals believe they have discovered the herb known as 'dog's tooth' in various parts of this province. According to legend, this was the same herb that the fisherman Glaucus ate to become immortal."
 VIET_glaucus_herb_good: "Curative Dog's Tooth"
 VIET_glaucus_herb_good_desc: "This character boldly ingested an herb thought to have given the fisherman Glaucus his immortality. Fortunately, it seems that the herb did have some beneficial effects."
 VIET_glaucus_herb_bad: "Sickened by Dog's Tooth"
 VIET_glaucus_herb_bad_desc: "This character was foolish enough to try an herb thought to have given the fisherman Glaucus his immortality. Unfortunately, it seems that the herb had some negative effects."
 VIET_flora_statue: "Statue of Flora"
 VIET_flora_statue_desc: "This character recently bought a statue of the goddess Flora to decorate their residence. It is quite beautiful! The craftsmanship looks excellent. Such a statue is surely a blessing."
 VIET_flora_statue_lustful: "Statue of Flora (for Nefarious Purposes)"
 VIET_flora_statue_lustful_desc: "This character recently bought a statue of the goddess Flora to decorate their residence. It is quite beautiful! The craftsmanship looks excellent. It seems this character, however, had baser, debauched reasons for purchasing such a statue of a nude woman."

 hellenic.500.title: "A Match Made In Hades"
 hellenic.500.desc: "The story of Persephone’s abduction by Hades has interested me as of late.\n\nHades seems like a calm, stoic type who justly dispenses judgment over the souls of the dead without bias and isn’t a philanderer like his brothers, so I wonder as to why he would have acted so rashly.\n\nIs there more to the story than meets the eye?"
 hellenic.500.a: "It was as they say. He had his way with Persephone."
 hellenic.500.b: "Maybe Hades conspired with her and the abduction was an excuse..."
 hellenic.500.c: "Perhaps a poet exaggerated the story for unnecessary drama."
 hellenic.500.d: "Sometimes I wonder what sort of history Hades and Demeter had..."
 hellenic.500.tooltip.1: "That mischievous Eros is to blame, having shot the arrow that made Hades obsessed. Persephone was beautiful and Hades was lonely and desperate."
 hellenic.500.tooltip.2: "Or maybe the two of them conspired with Demeter! Who knows — maybe they needed to protect Persephone from the philandering Zeus."
 hellenic.500.tooltip.3: "After all, Hades is one of the most faithful gods, so he doesn't seem the type to kidnap fair maidens. Maybe Hades was just socially awkward but the poets wanted a more sensational story."
 hellenic.500.tooltip.4: "What if Demeter secretly loved Hades? What if her anguish at losing her daughter was actually anguish at her unrequited love for Hades, but she was too embarrassed to admit it so she made up the story about Persephone’s abduction?"
 hellenic.501.tooltip.0: "She probably knows best after all and it would be improper if not blasphemous of me to make arbitrary assumptions about her."
 hellenic.501.title: "Sun and Moon"
 hellenic.501.desc: "I ponder on the stories surrounding Apollo and Artemis and how protective they were of one another.\n\nOrion died because Apollo feared Artemis would break her vow of chastity. Meanwhile, Artemis killed Apollo's lover Coronis when she cheated on him.\n\nIt sounds like a kind of jealousy and protectiveness, doesn’t it? I wonder whether the twins are closer than they appear... "
 hellenic.501.a: "Nah, probably just siblings who care about each other."
 hellenic.501.b: "Aha! Artemis' "virgin" status makes much more sense!"
 hellenic.501.c: "Haha, that's a good one. What are we, Zoroastrians?"
 hellenic.501.d: "Maybe I could ask the goddess herself..."
 hellenic.502.title: "What Happens Below Olympus"
 hellenic.502.tooltip: "I would like to, ah, have a more hands-on demonstration of what transpired between her and Zeus. For the sake of fair judgement, of course. But not when her husband is around, of course. "
 hellenic.502.desc: "[father.GetCharacterViewName] recently accused his wife [mother.GetCharacterViewName] of adultery. He says her newborn child, [baby.GetFirstName], is not his.\n\nShe claims, however, that Lord Zeus came down from the heavens and had his way with her and that while she did not want to be unfaithful, it would have been unwise for her to resist the powerful god.\n\nShe is not without her charms, so it wouldn't be impossible... right? Unable to resolve the dispute, they come to you for judgment."
 hellenic.502.a: "I'm sorry, but how is this supposed to be my problem?"
 hellenic.502.b: "Adulteresses have always used that excuse."
 hellenic.502.c: "Clearly this is a child of Zeus! Treat [baby.GetHerHim] well!"
 hellenic.502.d: "Why doesn’t she show me what Zeus did to her..."
 hellenic.503.title: "No Free Rides"
 hellenic.503.desc: "While visiting [barony.GetNameNoTier], I notice a beggar's corpse lying by the road. The locals said [dummy_gender.GetSheHe] recently died but otherwise ignore the corpse, saying someone will clean it up eventually.\n\nThe poor beggar doesn't even have the two coins needed to give to Charon in the afterlife, so that [dummy_gender.GetSheHe] may be able to travel to the underworld without hassle."
 hellenic.503.a: "I will give the corpse two of my own coins."
 hellenic.503.b: "It's not my business."

 # Invite Zeus
 hellenic.504.title: "Philoxenia"
 hellenic.504.desc: "A man comes to my residence, asking to let him stay the night. His face is kindly but he wears the tattered, ragged clothes of a vagrant.\n\nAs a [ROOT.Char.GetFaith.GetAdherentName], it is my duty to show #italic xenia#!, or hospitality, but realistically speaking [elder.GetName] could be a troublemaking hoodlum or even an assassin for all I know..."
 hellenic.504.a: "We must show #italic xenia#!. Let him in."
 hellenic.504.b: "Be rid of him. What if he's a thief?"
 hellenic.505.title: "Philoxenia: Retribution"
 hellenic.505.desc: "In a dream, the king of gods, Zeus, appears before me. Thunderclouds surround him and he is angry.\n\n"How dare you refuse me, arrogant swine! Have you forgotten #italic xenia#!?"\n\nI recoil in horror, realizing that beggar I rudely turned away was Zeus in disguise!"
 hellenic.505.a: "Have mercy! Don't curse me!"
 hellenic.506.title: "Philoxenia: Gratitude"
 hellenic.506.desc: "In a dream, the king of gods, Zeus, appears before me. He sits on a throne, smiling.\n\nAs I supplicate before him, he says, "You were wise to show hospitality to me. You know #italic xenia#!, mortal."\n\nThe beggar I accepted into my abode was Zeus in disguise!"
 hellenic.506.a: "Oh thank you!"
 hellenic.506.a.cynical: "Hold on, where is [elder.GetNameNoTooltip]?"

 hellenic.507.title: "Naiads in the Stream"
 hellenic.507.desc: "While traveling through [ROOT.Char.GetCurrentLocation.GetName] I come across some maidens bathing in the stream.\n\nEmbarrassed, I try to sneak away but they notice me.\n\nGiggling, they call me over, and I can't help but be entranced by their beauty and their sweet voices...\n\nAh! They must be local nymphs!"
 hellenic.507.a: "Don't mind if I join in!"
 hellenic.507.b: "No. I am loyal to my beloved and will resist the temptation."
 hellenic.507.c: "I have no interest in these giggly airheads."
 hellenic.507.d: "I will entertain you, but no naughty business."
 hellenic.507.d.female: "I suppose I shall be a nymph for a day."
 friend_hellenic_507_nymph: "[CHARACTER.GetShortUIName|U] and [TARGET_CHARACTER.GetShortUIName|U] innocently bathed together in a nymph's fountain."
 hellenic.508.title: "Pharmakós"
 hellenic.508.desc: "I come by a village in the [county.GetName] engaging in the #italic pharmakós#! ceremony, wherein a scapegoat — [criminal.GetName], chosen from among the disabled, slaves, and criminals —\nis ritually beaten and then exiled.\n\nThe village recently went through some rough times, and the ceremony will supposedly help the [county.GetAdjectiveNoTooltip] villagers gain the favor of [criminal.GetFaith.PantheonTerm] and restore their fortunes."
 hellenic.508.a: "Interesting. Carry on."
 hellenic.508.b: "Stop this! This is clearly a silly superstition."

 # Binding tablets
 hellenic.509.title: "Infernal Wrath"
 hellenic.509.desc: "One of my servants discovered a so-called "curse tablet" lying in a grave near my residence.\n\nAlarmingly, the writing on the tablet was an invocation of the dead spirits of the grave, as well as the gods of the underworld — Hades and Persephone — to bring misery and misfortune upon me.\n\nI have the [ROOT.Char.GetFaith.PriestNeuterPlural|l] properly dispose of the item, but I can’t help but feel uneasy."
 hellenic.509.a: "Oh no! [ROOT.Char.GetFaith.DivineRealm|U] have mercy on me!"
 hellenic.509.b: "It’s just mere superstition at the end of the day."
 hellenic.509.c: "There is nothing to fear from some stupid piece of writing!"
 hellenic.509.outcome: "What a terrible night to have a curse..."
 hellenic.510.title: "Cast a Spell On Me"
 hellenic.510.desc.opening: "I recently discovered [maid.GetName] trying to write a binding spell addressed to "
 hellenic.510.desc.other_god: "[maid.GetFaith.FertilityGodName]"
 hellenic.510.desc.spell: "— a love spell, in other words. \n\nSurprisingly, the spell targeted me. [maid.GetSheHe|U] wanted me, [maid.GetHerHis] [ROOT.Char.GetLadyLord], to fall in love with [maid.GetHerHim]!\n\n"
 hellenic.510.desc.female: "Though binding spells are typically thought of as something men would do, it is not unheard of for women to try using them. And my beautiful maid is young, naive, and at my complete mercy..."
 hellenic.510.desc.male: "I didn’t expect this from him, as he is shy and gentle, so it seems he learned about these spells from older peers. And my handsome servant is young, naive, and at my complete mercy..."
 hellenic.510.a: "This is ridiculous. Why do I put up with this?"
 hellenic.510.b: "I can teach you many things, darling..."
 hellenic.510.c: "[maid.GetSheHe|U] shall be punished for this witchcraft."
 hellenic.510.d: "I’m flattered, but it is misplaced."
 #hellenic.510.e: "I’m flattered, but I am your lord and you are a mere maid."
 hellenic.510.tooltip.1: "[maid.GetHerHis|U] face is beet red as [maid.GetSheHe] promises not to make anymore trouble, and you both agree to pretend this never happened."
 hellenic.510.tooltip.2: "Seems like [maid.GetHerHis] love spell worked after all. And there’s nothing like seducing an innocent [maid.GetWomanMan] and making [maid.GetHerHim] all yours."
 hellenic.510.tooltip.3: "Who knows what other crazy things [maid.GetSheHe] might be doing?"
 hellenic.510.tooltip.4: "You gently tell [maid.GetHerHim] that [maid.GetSheHe] is being silly. "Someday you’ll find true love," you tell [maid.GetHerHim] in a kindly tone. "I can help you find it in the future, if you want.""

 # Filial duty
 hellenic.512.title: "Family Bonds"
 hellenic.512.desc: "One of my prisoners — [father.GetName], an insignificant, elderly peasant — was starving and frail due to his advanced age and the conditions of his confinement, but his daughter [daughter.GetName] snuck into the prison every night, breastfeeding him so he could survive.\n\nFor such a display of #italic pietas#!, filial duty, many in my court say that [father.GetNameNoTooltip] should be given a pardon!\n\n[ROOT.Char.GetFaith.PantheonTerm|U] would be proud!"
 hellenic.512.a: "Clearly [ROOT.Char.GetFaith.PantheonTerm] [ROOT.Char.GetFaith.PantheonTermHasHave] blessed them. Release him!"
 hellenic.512.b: "And furthermore, I shall support them publicly for life!"
 hellenic.512.c: "The law will not allow this, no matter what [ROOT.Char.GetFaith.PantheonTerm] would think."
 hellenic.512.d: "I shall execute them for their insolence!"
 hellenic.513.title: "Nymph's Grace"
 hellenic.513.desc: "Rumors abound that a powerful nymph resides in [county.GetNameNoTier].\n\nShe was said to once be the wife and lover of a kind and wise lord who once ruled the area.\n\nThough he, a mortal, has since long passed, her spirit remains to this day and blesses the province every now and then with fortune and abundance."
 hellenic.513.a: "Interesting... maybe I’ll get to meet her one day?"
 hellenic.514.title: "Wayward Son"
 hellenic.514.desc: "[father.GetName] comes before me, asking for intervention in a family dispute.\n\nApparently his son [son.GetFirstName] is a devout worshipper of Cybele, the great mother goddess.\n\nLike many [son.GetFaith.GetAdherentNamePlural], [son.GetFirstNameNoTooltip] wishes to castrate himself and serve her for the rest of his life as a Galli.\n\nHowever, the father says that it is the son's duty to continue the family line."
 hellenic.514.a: "The father is right. Filial duty is as important as proper worship!"
 hellenic.514.b: "[son.GetFirstNameNoTooltip] is right. Faith must be rewarded!"
 hellenic.514.c: "They should ask an oracle for advice."
 hellenic.514.outcome: "Oracles resolve a family dispute"
 hellenic.514.tt.1: "The oracle favors [father.GetName]."
 hellenic.514.tt.2: "The oracle favors [son.GetName]."

 hellenic.515.title: "Paved With Good Intentions"
 hellenic.515.desc: "Near my capital a new village is being founded, and I am attending the opening ceremony.\n\nThe villagers make a hole, the #italic leptis manialis#!, said to represent the gateway to the underworld, and one that is dug each time a village is founded.\n\nAs the [ROOT.Char.GetTitleTierName], I am the first to leave an offering of fruit in the hole."
 hellenic.515.a: "May [ROOT.Char.GetFaith.PantheonTerm] bless this town for years to come."
 hellenic.516.title: "Shoot for the Moon"
 hellenic.516.desc: "[hunter.GetName], while out hunting, seems to have accidentally killed a [hunter.Custom('SmallAnimal')] in one of Artemis' sacred groves!\n\nThe man is afraid of divine retribution."
 hellenic.516.a: "Pray to Artemis for mercy and admit your mistakes!"
 hellenic.516.b: "Probably not a big deal."
 hellenic.516.a.tt: "[hunter.GetFirstName] prays for mercy"
 hellenic.516.b.tt: "[hunter.GetFirstName] suffers divine retribution"
 #hellenic.517.title: "Love Takes Many Forms"
 #hellenic.517.desc: "An important nobleman in my realm has recently married a great beauty who seems to have appeared out of nowhere. She is graceful and kind, clever and friendly, and claims to be a noblewoman from elsewhere. Rumor has it that she was a local nymph who fell in love with him and decided to take on the form of a mortal woman! What a lucky fellow."
 #hellenic.517.a: "He must have pleased Aphrodite and Eros."
 hellenic.518.title: "Fanatical Foliage"
 hellenic.518.desc: "Lightning recently struck one of the [province.Custom('GetRandomRegionalWood')] trees on my residence. It was an otherwise clear day with nary a sign of cloud or rain.\n\nMy [realm_priest.Custom('PriestTitle')] [realm_priest.GetFirstName] says that this was clearly a sign from [ROOT.Char.GetFaith.HighGodName], which [realm_priest.GetSheHe] then interpreted as a good omen.\n\nMy courtiers have already begun to treat the tree as a "fanaticus," a sacred tree blessed by [ROOT.Char.GetFaith.HighGodName]."
 hellenic.518.a: "Good to hear."
 hellenic.519.title: "Nobody, In Particular"
 hellenic.519.desc: "The ancient Latins regarded the ancient hero Ulysses as nothing more than a coward who manipulated and deceived those around him.\n\nThe ancient Hellenes, on the other hand, who knew him as Odysseus, believed that his cunning was an admirable trait showing his resourcefulness and wisdom."
 hellenic.519.a: "The Latins are right — Ulysses is a chicken-hearted liar!"
 hellenic.519.b: "The Greeks are right — Odysseus is brave and intelligent!"
 hellenic.519.c: "Who cares? He’s long dead."

 #Underworld
 hellenic.520.title: "Theseus and Pirithous"
 hellenic.520.desc: "One of my courtiers, [pirithous.GetName], is extremely drunk.\nSo drunk, in fact, that [pirithous.GetSheHe] suddenly declares that [pirithous.GetSheHe] shall rescue Persephone from the evil Hades!\n\nEveryone rolls their eyes at this blasphemy.\n\n[pirithous.GetFirstNameNoTooltip] then asks me, [pirithous.GetHerHis] liege, to assist [pirithous.GetHerHim] in this effort. Together, we both would travel to the underworld and save Persephone from her dark husband.\n\nI shake my head and tell [pirithous.GetHerHim] to watch [pirithous.GetHerHis] mouth."
 hellenic.520.a: "No one insults the gods."
 hellenic.520.a.tooltip: "And unlike his philandering brothers, Hades is a good and faithful husband, after all."
 hellenic.520.b: "Perhaps this venture is better discussed privately."
 hellenic.520.b.tooltip: "Some may dismiss it as madness, but I would do well to lend an ear to [pirithous.GetFirstNamePossessiveNoTooltip] revelations."
 hellenic.521.desc: "You have angered Hades and Persephone with your blasphemous claims!"
 hellenic.521.a: "Oh no! I don’t want to go to Tartarus!"
 hellenic.522.title: "Hades Aidoneus"
 hellenic.522.desc: "In my dreams, a man and woman appear before me. They are dark and brooding, but do not seem malevolent. The woman is young and has golden tresses that frames her pale, beautiful face. The man is tall and stern, lean and handsome.\n\nHe speaks first. "Your friend shall be punished for [pirithous.GetHerHis] blasphemous proclamation. Only a fool tries to steal my wife from the underworld, and [pirithous.GetSheHe] shall suffer in Tartarus. But you rightly warned [pirithous.GetHerHim]. For your wisdom, I, Lord Hades, and my wife, Queen Persephone, shall grant you our blessings."\n\nThe next morning, [pirithous.GetFirstName] is found dead for no apparent reason."
 hellenic.522.a: "Lord Hades is just... [pirithous.GetFirstNameNoTooltip]’s hubris led to [pirithous.GetHerHis] downfall!"
 hellenic.522.b: "I hope Persephone will appeal to Hades for mercy on [pirithous.GetFirstNameNoTooltip]’s soul."

 hellenic.523.title: "Judgement of Paris"
 hellenic.523.desc: "I am sitting with my courtiers, having idle conversation. They are discussing the Trojan War and how it all started when Hera, Athena, and Aphrodite competed to see which one of them was the loveliest of all.\n\n[debate_left.GetFirstName] and [debate_right.GetFirstName] begin debating which of the three goddesses was truly the most beautiful.\n\n"Paris may have chosen Aphrodite, but who would you have chosen?""
 hellenic.523.a: "Paris was right to choose her. She's the goddess of beauty after all."
 hellenic.523.b: "Hera, I think. A true beauty is regal and maternal."
 hellenic.523.c: "Athena in my opinion. Intelligence is very attractive."
 hellenic.523.d: "I'm a woman. Why should I care? Stupid men and their fantasies."
 hellenic.523.e: "I don't care. Now between Apollo, Zeus, and Ares, I'd choose..."
 hellenic.524.title: "Fairest of Them All: Aphrodite"
 hellenic.524.desc: "Later that night, in my dreams, a woman appears before me. She is physically perfect — from her body to her face to the aura that emanates from her — and every part of her is desirable. She is no doubt Aphrodite, goddess of love and beauty, and I prostrate before her. She laughs and tells me that I made the right choice in saying she was the most beautiful of all."
 hellenic.524.a: ""To think Hera and Athena could compete with #italic me#!, the goddess of beauty!""
 hellenic.525.title: "Fairest of Them All: Hera"
 hellenic.525.desc: "Later that night, in my dreams, a woman appears before me.\n\nShe is beautiful, but in a dignified manner befitting that of a queen. Queen? I realize that she is none other than Hera, queen of the gods!\n\nAs I bow to her, she says that she was rather pleased when I said that she was the most beautiful of all."
 hellenic.525.a: ""Indeed, Aphrodite and Athena are but silly little girls!""
 hellenic.526.title: "Fairest of Them All: Athena"
 hellenic.526.desc: "Later that night, in my dreams, a woman appears before me.\n\nShe is a young maiden of incomparable beauty. She wears a full suit of armor, and wields a spear.\n\nI realize that she is the great Athena!\n\nAs I pay my respects, she explains that I was wise in arguing that she was the most beautiful of all."
 hellenic.526.a: ""That Aphrodite is such a strumpet, you know that?""
 
 hellenic.527.title: "Chiseled Stone Features"
 hellenic.527.desc: "[courtier.GetName] suggested that I build some more herma in the area around my residence.\n\nAccording to [GetFaithByKey('hellenic_pagan').GetAdjective] custom, herma are a rectangular column with the head of a deity on top (usually Hermes) and a phallus carved into the column.\n\nThey are said to bring good luck and fortune."
 hellenic.527.a: "Yes, good idea — we’ll show our devotion!"
 hellenic.527.b: "Phallic statues? Are you kidding me?"
 hellenic.528.title: "Ribald Ritual"
 hellenic.528.desc: "While visiting [ROOT.Char.GetCurrentLocation.GetName], my entourage and I pass by a large statue of Priapus, the old god of fertility.\n\nLike most statues of the god, he is depicted with an oversized, exaggerated member, everyone is supposed to touch in order to call for the god’s blessings.\n\nIf anyone angered Priapus, it is said that he would threaten to sexually assault them, regardless of gender or age or background."
 hellenic.528.a: "I duly touch the statue’s phallus and move on."
 hellenic.528.b: "Ew, I am not touching that disgusting thing!"
 hellenic.528.b.tt: "Failed to honor Priapus"
 hellenic.529.title: "Household Gods"
 hellenic.529.desc: "Every now and then I pay homage to my family’s Lares, the local guardian deities who have protected the [ROOT.Char.GetDynasty.GetBaseName] dynasty since time immemorial.\n\nIt is important I honor them with sacrifices and offerings, so that they may provide help in times of need.\n\nI approach the lararium, the shrine where the small statue of the Lar is placed."
 hellenic.529.a: "#italic Salve lar familiaris!#!"
 hellenic.529.outcome: "The Lares bless your house"

 hellenic.530.title: "The Greatest City-State"
 hellenic.530.desc: "The greatest of the ancient Hellenic city-states were Athens and Sparta, yet in comparing and contrasting them, one can easily see how they were very different.\n\nToday, I've come across [athens.GetFirstName] and [sparta.GetFirstName] arguing about which one was better. Seeing me nearby, they ask for my input.\n\nWas it the mighty, warrior Spartans who were better?\n\nOr the crafty, philosophy-loving Athenians?"
 hellenic.530.a: "Athens of course! An admirable, cultured people."
 hellenic.530.b: "Sparta, no doubt. Their armies were to be feared!"
 hellenic.530.c: "They were both flawed and pathetic, for they had great hubris."
 hellenic.530.d: "Actually, I have to go with Thebes."
 hellenic.531.title: "A Prayer for Nyx"
 hellenic.531.desc: "There are a number of deities who are not popularly worshipped, but most of them are minor compared to the mightiest of the gods. Yet some are quite powerful.\n\nFor instance, I have been thinking about Nyx, the goddess who is Night itself, who is feared even by Zeus.\n\nPerhaps it might do to show this underappreciated deity some devotion."
 hellenic.531.a: "Some prayers will do."
 hellenic.531.b: "I’ll dedicate a statue and praise her with ancient poetry."
 hellenic.531.c: "I'm just being superstitious. Enough!"
 VIET_nyx_poetry_praise: "O Nyx!\nEver shall this house throughout the circling periods of the year hold thee high in honour and in worship.\nBlack bulls of chosen beauty shall pay thee sacrifice.\nO goddess!\nHephaestos' fire shall eat the lustral entrails, where-o'er the new milk streams." #Statius, Thebaid 1. 497 ff
 hellenic.532.title: "Errant Arrows"
 hellenic.532.desc: "Today I felt an unusual amount of lust, so alarming that I had to consult with my [realm_priest.Custom('PriestTitle')]. Surely this was not a natural occurrence.\n\n[realm_priest.GetFirstName] concluded that one of the so-called Erotes, lesser gods who are Aphrodite's sons and attendants, must have pranked me for some reason.\n\n[realm_priest.GetSheHe|U] gave me some spells to recite. Hopefully, they will repel the Erotes and their mischief."
 hellenic.532.a: "Let these spells work!"
 hellenic.532.b: "On the other hand, these feelings #italic are#! natural."
 hellenic.532.c: "Wait, couldn't I just appeal to Aphrodite herself?"
 hellenic.533.title: "Aphrodite's Gift"
 hellenic.533.tooltip: "Surely she will be able to help me. I will pray to her and make offerings."
 hellenic.533.desc: "Later that night, in your dreams, Aphrodite appears before you. She is graceful, elegant, and beautiful beyond compare even as she apologizes to you about the Erotes. "Those sons of mine should not have been such a nuisance to you," she says. "After all, I have no quarrel with you. Yet. Now, take this small token as appreciation for your wisdom in praying to me for help. You clearly know who is in charge."\n\nWhen you wake up, you feel normal again, yet strangely, more confident and blessed."
 hellenic.533.a: "What a mysterious dream!"
 hellenic.534.title: "To Err is Mortal"
 hellenic.534.desc: "I am attending a minor religious ceremony when the [priest.Custom('PriestTitle')|l] performing the public prayer accidentally forgot to mention a couple of the prayer's beneficiaries.\n\nProfessionals usually don't make such mistakes, but per [ROOT.Char.GetFaith.GetAdjective] custom and belief, this cannot be ignored.\n\nThough it is almost done, the entire ritual must be redone if it is to be effective. Am I willing to sit through all that again?"
 hellenic.534.a: "We all make mistakes — restart the ritual."
 hellenic.534.b: "If [priest.GetSheHe] messes up again, I'll punish [priest.GetHerHim]!"
 hellenic.534.c: "I don't want to sit through this again."
 hellenic.534.d: "Does it matter? It's just words."
 hellenic.535.title: "Matron of Foals"
 hellenic.535.desc: "A local town in the [county.GetName] has unveiled a new statue of Epona, the goddess of horses, donkeys, and fertility.\n\nOnce a Gallic deity, she was adopted by the Romans as their own and is fast gaining popularity again."
 hellenic.535.a: "May she protect the locals."
 hellenic.536.title: "Orcus Morari"
 hellenic.536.desc: "[oathbreaker.GetName] recently broke a oath [oathbreaker.GetSheHe] made not too long ago.\n\nIt was a minor oath, of little importance, and yet some in my [ROOT.Char.Custom('GetCourt')] cannot help but point out that [oathbreaker.GetSheHe] will have to answer to Orcus, the god of the Underworld who punishes oath breakers."
 hellenic.536.a: "At least it wasn't me!"
 hellenic.536.b: "I should remember not to break oaths myself."
 hellenic.536.c: "Silly nonsense. Orcus wouldn't deign to punish a random mortal."
 hellenic.537.title: "The Limping Smith"
 hellenic.537.desc: "Some say the god of the forge, Hephaestos, truly was hideous and ugly.\n\nOthers say he was actually quite good-looking, but only by mortal standards, and thus was only "ugly" for a deity.\n\nYet others say through the centuries, confused and foolish people misunderstood the [GetFaithByKey('hellenic_pagan').GetAdjective] myths, and he is as handsome as any other god."
 hellenic.537.a: "He is probably ugly, but an Olympian nevertheless."
 hellenic.537.b: "He is probably good-looking for a mortal."
 hellenic.537.c: "Who could think of an Olympian being ugly?"
 hellenic.538.title: "Reap What You Sow"
 hellenic.538.desc: "A farmer living in [county.GetNameNoTier] has been accused of using various magical charms to reduce his neighbor's crops and increase his own.\n\nThis is an affront to [faith.FertilityGodName] and by [faith.GetAdjective] custom is to be punishable by death.\n\nThe accused claims this was all a misunderstanding and that he was merely doing some protective but not harmful charms for his own crops, but further investigation reveals that he is guilty and will be hung in the name of [faith.FertilityGodName]."
 hellenic.538.a: "Such are the ancient laws."
 hellenic.539.title: "Floral Decoration"
 hellenic.539.desc: "[florist.GetName] has recently purchased a statue of Flora for [florist.GetHerHis] garden. As goddess of flowers, her presence is welcoming in a garden.\n\nI and several others paid a visit to [florist.GetHerHim] and found the statue most agreeable — it almost seems alive, as if the statue will start moving at any moment.\n\n[florist.GetFirstNameNoTooltip] says [florist.GetSheHe] can refer me to the sculptor, who charges a decent price."
 hellenic.539.a: "A fine addition to my collection."
 hellenic.539.b: "I shall use the statue as a private altar."
 hellenic.539.c: "The statue is almost like a real girl! Mine will fuel my imagination...."
 hellenic.539.d: "On second thought, I am not willing to pay that much."
 hellenic.540.title: "Lord of Waste"
 hellenic.540.desc: "One day I am talking with a traveling merchant who has recently come back from a long trip to faraway lands.\n\n[merchant.GetName] said how in other realms, foreigners mock some of our gods as being frivolous.\n\nIn particular, [merchant.GetSheHe] remembers an encounter with a particularly rude man who could not understand the concept of Sterquilinus, our god of feces and sewage."
 hellenic.540.a: "How ignorant. Even a god of such things is a god!"
 hellenic.540.b: "It sounds silly, but every deity has their purpose, as we all do."
 hellenic.540.c: "Manure is an important aspect of agriculture!"
 hellenic.541.title: "Apple of My Eye"
 hellenic.541.desc: "While traveling in the countryside nearby I come across a beautiful, wild fruit tree, full of fresh, ripe fruit.\n\nI pick a few of the apples and eat them, and find them most pleasing to my palate.\n\nSurely, to come across such a thing today is no coincidence! Perhaps this is a good sign from the goddess Pomona, whose domain is the flowering of fruit trees."
 hellenic.541.a: "Maybe, maybe not. Delicious, nevertheless!"
 hellenic.541.b: "I should thank her with offerings when I get home."
 hellenic.542.title: "Judgement Bolt"
 hellenic.542.desc: "A brief storm recently caused much anxiety.\n\nA bolt of lightning struck the statue of Zeus atop a local temple, and its head was nowhere to be seen afterwards.\n\nDiviners however determined it was hurled into a nearby river in [barony.GetNameNoTier]. Sure enough, it was found right there, and restored to the temple.\n\nSome say Zeus wishes to remind us of our duties and place in life."
 hellenic.542.a: "I believe that as well."
 hellenic.542.b: "We must be virtuous with or without such reminders."
 hellenic.542.c: "It was just a lucky coincidence."
 hellenic.543.title: "Herb of Immortality"
 hellenic.543.desc: "An herb was recently discovered in [county.GetName] that is said to be the "dog’s tooth," which is the same kind of herb that gave the legendary fisherman Glaucus his immortality and turned him into the prophetic sea-god he is today.\n\nThat notion was easily dispelled, when a local criminal who ate the herb was nevertheless executed for his crimes, but there are those who still fervently believe that even if it doesn’t give immortality, that the herb has many beneficial effects."
 hellenic.543.a: "What fools they are!"
 hellenic.543.b: "Perhaps I could try some myself? Just in case."
 hellenic.543.c: "[food_taster.GetFirstNameNoTooltip] can test it for me."
 VIET_glaucus_herb_good_text: "The herb has a positive effect"
 VIET_glaucus_herb_bad_text: "The herb has a negative effect"
 hellenic.544.title: "Athena's Insight"
 hellenic.544.desc: "Last night I dreamt a beautiful woman dressed in armor visited me, and we had the most insightful discussions on many different topics.\n\nShe even showed me some valuable scrolls filled with ancient wisdom.\n\nBefore the dream ended, she said she was in fact the goddess Athena, and that she found it pertinent to her interests that I learned a few things from her."
 hellenic.544.a: "That was quite a dream! I feel smarter already."
 hellenic.545.title: "Friends In Low Places"
 hellenic.545.desc: "Dignitaries from [county.GetNameNoTier] visited me today, bearing gifts of pomegranates in Hades and Persephone’s honor.\n\n[dignitary.GetName] said that many generations ago, in the days of the old Roman Empire, the [dignitary.GetCulture.GetCollectiveNoun] of [dignitary.GetHerHis] town were constantly under threat by a powerful band of bandits.\n\nThey prayed to all the gods, but only Hades and Persephone came to their aid, for some reason. Thus they honor them even now."
 hellenic.545.a: "An interesting tale! And thank you for the pomegranates."