l_english:

#Egyptian flavor for ACR written by cybrxkhan
 opinion_egyptian_sexytimes: "Exciting Romp"
 VIET_garlic_distribution: "Distributed Garlic to the Temples"
 VIET_garlic_distribution_desc: "Garlic was a highly revered crop and important to the ancient Egyptians."
 VIET_planted_palm_trees: "Planted Palm Trees"
 VIET_planted_palm_trees_desc: "Seeking to emulate the ancient Egyptians, the ruler of this province has ordered the planting of palm trees for shade, good luck, and prosperity."
 VIET_khnum_amulet: "Amulet of Khnum"
 VIET_khnum_amulet_desc: "This character possesses an amulet of the Kemetic god Khnum."
 VIET_province_desecrated_egyptian_tombs: "Ancient Tombs Desecrated"
 VIET_province_desecrated_egyptian_tombs_desc: "Somebody's been ransacking ancient tombs in this province... the gods will punish them in the afterlife. Hopefully."
 VIET_not_upholding_maat: "Not Upholding Ma'at"
 VIET_not_upholding_maat_desc: ""You're a terrible ruler! You should be ashamed of yourself! When your heart is judged by Osiris in the afterlife, he shall see the imbalance in your Ma'at and you will be thrown to the terrible beast Ammit!""
 egyptian.150.title: "Garlic Distribution"
 egyptian.150.desc: "In olden times, the people of Egypt valued that most wonderful and delicious vegetable, garlic. It pleased the gods and was used to take oaths.\n\nPerhaps it would be a good idea to order large quantities of garlic to be distributed to the [ROOT.Char.GetFaith.HouseOfWorshipPlural] scattered across our realm!"
 egyptian.150.a: "Yes, let's do it. Praise be to [ROOT.Char.GetFaith.PantheonTerm]!"
 egyptian.150.b: "No, this sounds silly, and we do not have the resources."
 egyptian.151.title: "Planting Palms"
 egyptian.151.desc: "The powerful men and women of ancient Egypt often planted palm trees not just for their dates, but to provide good shade in their palaces and temples.\n\nI feel as if it would be wise if I did the same to my residence and the nearby [ROOT.Char.GetFaith.HouseOfWorshipPlural]. If anything, I can show many my power and remind them of the splendor of the [ROOT.Char.GetCulture.GetCollectiveNoun]!"
 egyptian.151.a: "Let us plant the trees, then!"
 egyptian.151.b: "Perhaps I should not, this seems vain and pointless."
 egyptian.152.title: "The Amulet of Khnum"
 egyptian.152.desc: "[gifter.GetCharacterViewName] has given me a beautifully crafted [newly_created_artifact.GetFeatureText( 'decoration_material_wire' )] amulet dedicated to the god Khnum.\n\nAs controller of the Nile, Khnum brings fortune to all and is not to be ignored."
 egyptian.152.a: "Thank you! May this amulet help me in this life."
 egyptian.152.b: "It belongs in a temple."
 egyptian.153.title: "Tomb Raiders"
 egyptian.153.desc: "Ill news! Lately it seems a crafty band of robbers have been breaking into various tombs in [tomb_county.GetNameNoTier], desecrating corpses and making away with whatever riches they can find.\n\nHow now will the dead be able to properly protect their descendants, much less live contentedly in the afterlife with [ROOT.Char.GetFaith.DeathDeityName]? This is a shame, indeed, and nothing but a shame!"
 egyptian.153.a: "Hopefully local security will catch these brigands..."
 egyptian.153.b: "We will provide some aid to protect any unplundered tombs."
 egyptian.153.a.outcome: "Local security handles grave robbers"
 egyptian.153.b.outcome: "Helped protect unplundered tombs"
 egyptian.154.title: "Not Alone"
 egyptian.154.desc: "In my dream I was surrounded by evil spirits. I was lost. I was scared. I fell to despair, I lost hope.\n\nBut then came the god Bes, that dwarf-god of grotesque appearance, and I saw him as he took out his swords and knives and waved them like a soldier, to ward off the demons. I saw as he took out his musical instruments and played loud songs to frighten them."
 egyptian.154.a: "As he protected the Pharaohs of old, so has he protected me just now!"
 egyptian.154.b: "As I awoke, I felt at peace."
 egyptian.155.title: "Evil Within"
 egyptian.155.desc.opening: "I feel that despite my many good deeds, there is still\nIsfet — evil — within me that must be purged, for I have certainly done "
 egyptian.155.desc.sinful: "sinful "
 egyptian.155.desc.sinful_specific: "[ROOT.Char.Custom('SinfulTrait')|l]"
 egyptian.155.desc.closing: "things as a ruler.\n\nIf my heart is out of balance with Ma'at, then in the afterlife\nI will be devoured by the terrible beast Ammit and I will have no chance of a peaceful immortality.\n\nThus, I must seek the counsel of my [realm_priest.Custom('PriestTitle')] [realm_priest.GetFirstName], who knows how to alleviate me of this worry!"
 egyptian.155.a: "I must ensure my place in [ROOT.Char.GetFaith.PositiveAfterLife]!"
 egyptian.155.tooltip: "You attempt to cleanse yourself of sins"
 egyptian.155.b: "On second thought, all this talk of "evil" is stupid."
 egyptian.156.tooltip: "Off to the temple we go."
 egyptian.156.title: "Expel the Evil in my Heart"
 egyptian.156.desc: "[realm_priest.GetName] understands my worries, and knows the right incantation for my situation. [realm_priest.GetSheHe|U] thus begins to chant in my presence:\n\n"I am bringing the gods incense and natron.\nI want to expel the bad smell from your mouth.\nTherefore I come in order to expel the evil in your hearts.\nWith this I remove the Evil, Isfet, which clings to you.\nWith this I bring you Good.\nI present Justice, Ma'at, to you...""
 egyptian.156.a: "I begin to feel relieved as my soul is cleansed."
 egyptian.156.b: "By [ROOT.Char.GetFaith.random_GoodGodNames], I must set the scales right."
 egyptian.156.failure: "Failed to absolve sins"
 egyptian.157.title: "All in Balance"
 egyptian.157.desc: "The [ROOT.Char.GetFaith.GetAdherentNamePlural] I rule over believe that no matter what hardships they face, my rule has maintained the balance of\nMa'at — justice, goodness, the natural order — in the realm. They praise me for my efforts."
 egyptian.157.a: "Good to hear!"
 egyptian.158.title: "With a Heavy Heart"
 egyptian.158.desc.opening: "Regardless of whether they are right or wrong, the [ROOT.Char.GetFaith.GetAdherentNamePlural] I rule over believe that due to my "
 egyptian.158.desc.sinful_specific: "[ROOT.Char.Custom('SinfulTrait')|l]"
 egyptian.158.desc.closing: "style of rule, I unfortunately have been unable to maintain the balance of\nMa'at — justice, goodness, the natural order — in the realm."
 egyptian.158.a: "They don't understand! Don't understand at all!"
 egyptian.159.title: "Feline Grace"
 egyptian.159.desc: "To honor the traditions of the ancient Egyptians, many women in the region have taken to adopting pet cats, for they represent feminine fertility and sensuality.\n\nOne day while lounging with my wife [spouse.GetFirstName], I notice she is playing with one of her cats, and I can't help but notice that she is looking at me in a rather seductive, cat-like manner, and suddenly I feel as if I want to learn more about this cat-like fertility and sensuality in a more practical, hands-on sense..."
 egyptian.159.a: "Come here, kitty..."
 egyptian.160.title: "Catching Strays"
 egyptian.160.desc: "A heinous crime! The wretched criminal is brought before me, and few in my court can bear to look at the deviant, lawless, inhuman evil-doer.\n\n[criminal.GetName] will be punished severely for [criminal.GetHerHis] deed, of course, that is without a doubt.\n\nI tell the [criminal.GetWomanMan] [criminal.GetHerHis] sentence, and my guards take [criminal.GetHerHim] away."
 egyptian.160.a: "Terrible! To think [criminal.GetSheHe] murdered a cat, even by accident!"
 egyptian.160.a.flavor: "An unforgivable crime."
 egyptian.160.b: "Come now, it's just a cat."
 egyptian.161.title: "Queens of the Nile"
 egyptian.161.desc: "Ancient texts describe how in old Egypt, women were viewed as having greater amount of rights, privileges, and opportunities than they do today. Or so I've been told.\n\nPerhaps I should treat the women of my court with more respect if I am to properly observe [ROOT.Char.GetCulture.GetName] customs."
 opinion_egyptian_respects_women: "Respects Women"
 opinion_egyptian_stop_being_feminist: "Listens too much to women"
 opinion_egyptian_disrespects_women: "Disrespects Women"
 egyptian.161.a: "Yes! The elders speak true, we must treat women better."
 egyptian.161.a.tooltip: "Every female [courtier|E]"
 egyptian.161.b: "Nonsense! Probably just blabber made up by nagging housewives."
 egyptian.161.b.tooltip: "Every male [courtier|E] that disapproves"
 #egyptian.162.title: "Your Move"
 #egyptian.162.desc: "A courtier has challenged me to a game of Senet. This ancient game has been played in Egypt throughout recorded history, and I like to think that while I'm not the best at it, I can still hold my own."
 #egyptian.162.a: "Let's play!"
 #egyptian.163.tooltip: "We'll see who wins..."
 #egyptian.163.desc: "I have challenged my liege to a game of Senet. This ancient game has been played in Egypt ever since recorded history, and I like to think that while I'm not the best at it, I can still hold my own."
 #egyptian.163.a: "Let's see who wins!"
 #egyptian.164.tooltip: "You win"
 #egyptian.164.desc: "I've been beaten me in Senet! A humiliating defeat, but a well-deserved one."
 #egyptian.164.a: "Good game. You got me this time!"
 #egyptian.164.b: "How dare you!"
 #egyptian.165.tooltip: "You lose"
 #egyptian.165.desc: "I have won the Senet match. Clearly the Gods have favored me!"
 #egyptian.165.a: "You played well, however!"
 #egyptian.165.b: "Haha! What a pathetic loser!"
 #opinion_egyptian_senet_game: "Played Senet"
 #opinion_egyptian_pathetic_senet_player: "Pathetic Senet player"
 #opinion_egyptian_smug_winner: "Smug Winner"
 #opinion_egyptian_sore_loser: "Sore Loser"
 #opinion_egyptian_lost_senet_game: "Lost Senet Game"
 egyptian.166.title: "Shadow of the Sun"
 egyptian.166.desc: "My courtier [mad_courtier.GetName] claims that while taking a walk today [mad_courtier.GetSheHe] was by [mad_courtier.GetHerselfHimself] and encountered the ghost of Akhenaten himself!\n\nThis abominable heretic, an incompetent Pharaoh obsessed with the god Aten, caused much mayhem in old Egypt and was rightfully cursed by the priests once the old, true religion was restored.\n\nBut this is not good news... has [mad_courtier.GetNameNoTooltip] been cursed as well?"
 egyptian.166.a: "Better get to the priests quickly, dear friend, just in case!"
 egyptian.167.title: "Bloodthirst"
 egyptian.167.desc: "I watch solemnly as [criminal.GetName] is beheaded. Off goes [criminal.GetHerHis] head, and [criminal.GetHerHis] blood spills to the ground.\n\nShezmu, the demon-god known as the Overthrower of the Wicked at the Block, the Slaughterer of Souls, and the Lord of Blood, must be pleased.\n\nThey say when the condemned are executed, he throws their severed heads into a wine press and turns it into red wine."
 egyptian.167.a: "Righteous red wine! I think I'll have some later today."
 VIET_opinion_egypt_maid_loyal: "Loyal Maid"
 VIET_opinion_egypt_maid: "Loyal Maid"
 VIET_creepy_courtier_caught: "Imprisoned Me for My Dark Magic"
 VIET_creepy_courtier_publically_humiliated: "Publicly Denounced My Dark Magic"
 VIET_creepy_courtier_successful_bribe: "Accepted Bribe"
 VIET_creepy_courtier_successful_ignore: "Ignored Dark Magic"
 VIET_egypt_meal_horny_onion: "Delicious Onion"
 VIET_egypt_meal_clean_beans: "Delicious Beans"
 VIET_egypt_meal_sacred_garlic: "Delicious Garlic"
 VIET_vision_of_field_of_reeds: "Field of Reeds"
 VIET_vision_of_field_of_reeds_desc: "This character dreamt of Aaru, the Field of Reeds, which is where the blessed go in the Egyptian afterlife."
 VIET_egyptian_dark_magic: "Dark Magic"
 VIET_egyptian_dark_magic_desc: "This character has been accused — with solid evidence to back it up — of using dark magic to bind innocent victims to sate an unnatural lust."
 VIET_creepy_courtier_failure: "Failed to Save Victim"
 VIET_creepy_courtier_failure_desc: "This character failed to save one of their subjects from a dark fate. Though it was never known what happened, it's likely it was no pleasant end due to this character's negligence."
 egyptian.168.title: "Rise as Dawn"
 egyptian.168.desc: ""Rise like Nefertem from the blue water lily, to the nostrils of Ra, and come forth upon the horizon each day." So the Book of the Dead says.\n\nA small statue of Nefertum — god of fragrance and beauty — watches over me during my morning routine.\n\nThe original lotus flower and the first sunlight at the beginning of creation, he is depicted as a handsome young man."
 egyptian.168.a: "Let Nefertum protect me!"
 egyptian.169.title: "Light of the Father"
 egyptian.169.desc: "It is evening, and I am about to retire to my quarters to go to bed. I and a few courtiers gaze to the stars, and [courtier.GetName] points out Sah, the Father of the Gods.\n\nThe constellation, which the ancient Greeks called Orion and Lepus, has often been associated with Osiris.\n\nTonight, the stars of Sah glow unusually bright and warm, and it makes me feel a sense of comfort."
 egyptian.169.a: "An illuminating presence."
 egyptian.170.title: "Shed Save Us"
 egyptian.170.desc: "One day I pass by [courtier.GetName], who is muttering something. Curious, if not a touch suspicious, I question [courtier.GetHerHim].\n\n[courtier.GetSheHe|U] tells me [courtier.GetSheHe] has been having some problems in life recently, and is praying to Shed, the savior deity, for help.\n\nYet when I listen to [courtier.GetHerHis] story, [courtier.GetHerHis] problems seem irrelevant — not the calamities such as fatal illness or death that Shed is supposed to save us from!"
 egyptian.170.a: "Sometimes people need help, even for small matters."
 egyptian.170.b: "We shouldn’t trouble the gods like that."
 egyptian.170.c: "How dare [courtier.GetSheHe] use Shed’s name in vain!"
 egyptian.170.d: "It’s none of my concern."
 egyptian.171.title: "Underworld"
 egyptian.171.desc: "In my nightmares, I died and went to [ROOT.Char.GetFaith.PositiveAfterLife]. I passed many terrifying monsters before I came to the court of Osiris.\n\nIn the Hall of Two Truths, Anubis, his face like a snarling, protective canine, weighed my heart against the feather of Ma’at and I was deemed impure!\n\nThe demoness Ammit devoured my heart, and I screamed in pain, only to awaken."
 egyptian.171.a: "It is a vision! I must reform myself!"
 egyptian.171.b: "Dreams are but dreams, fleeting illusions."
 egyptian.172.title: "Traditional Ingredients"
 egyptian.172.desc: "I dip the lettuce in oil and salt and eat it with some beans, onions, and garlic, just like the ancient Egyptians did. A good simple meal, but even the simplest of ingredients can have side effects.\n\nThe ancients said that beans help with digestion, onion increases one’s libido, and garlic is believed to have some spiritual powers, being the vegetable invoked during oaths."
 egyptian.172.a: "I suddenly feel a great desire for intimacy."
 egyptian.172.b: "My stomach suddenly feels cleaner, somehow."
 egyptian.172.c: "The holy power of garlic seems to compel me."
 egyptian.173.title: "Fruits of the Nile"
 egyptian.173.desc: "It is time that I donate some food to the local [ROOT.Char.GetFaith.HouseOfWorship].\nAmong the [ROOT.Char.GetFaith.GetAdherentNamePlural], then as now, various fruits are very popular for these kinds of offerings.\n\nThe question is what kind of fruit would be most appropriate, of course."
 egyptian.173.a: "Grapes and raisins"
 egyptian.173.a.result: "You donate grapes and raisins"
 egyptian.173.b: "Pomegranates"
 egyptian.173.b.result: "You donate pomegranates"
 egyptian.173.c: "Dates"
 egyptian.173.d: "Figs"
 egyptian.174.title: "Adrift in Reeds"
 egyptian.174.desc: "In my dreams I walk — perhaps float — through a field of reeds. I cannot tell if it is sunrise or sunset, and the sky is a fixture of pink, red, and orange hues, though I see yellow in the far horizon.\n\nThere is no one nor any sound, save for a faint rustling of the wind in the reeds. Yet I feel loved, I feel at peace, I feel like I am here, somehow, with everyone.\n\nI slowly awake, and feel at ease."
 egyptian.174.a: "I must have seen a vision of Aaru, the afterlife."
 egyptian.175.title: "Dark Magic in My Court"
 egyptian.175.desc: "[creepy_courtier.GetName] has always been a questionable [creepy_courtier.GetWomanMan], but most ignored [creepy_courtier.GetHerHis] infatuation with [paramour.GetName].\n\nBefore [creepy_courtier.GetSheHe] used to pray to Hathor to help [creepy_courtier.GetHerHim] bed the [paramour.GetWomanMan], but now [creepy_courtier.GetSheHe] has just been discovered attempting to use magic charms to subjugate [paramour.GetHerHim] to satisfy [creepy_courtier.GetHerHis] wanton lust!\n\n[paramour.GetFirstNameNoTooltip] is terrified and asks for my protection, and my court is scandalized!"
 egyptian.175.a: "Imprison [creepy_courtier.GetHerHim]! This is evil dark magic!"
 egyptian.175.b: "Reprimand and humiliate [creepy_courtier.GetHerHim] in public."
 egyptian.175.c: "These accusations of sorcery are unfounded."
 egyptian.175.d: "This is beneath my attention."
 VIET_creepy_courtier_imprison: "We cannot allow such an evil sorcerer in our midst."
 VIET_creepy_courtier_humiliate: "Now that [creepy_courtier.GetSheHe] is publically humiliated, [creepy_courtier.GetSheHe] will leave the [paramour.GetWomanMan] alone — otherwise, [creepy_courtier.GetSheHe] could face worse."
 VIET_creepy_courtier_bribe: "[creepy_courtier.GetFirstNameNoTooltip] is a good [creepy_courtier.GetWomanMan], I’m sure of it! It’s not like [creepy_courtier.GetSheHe] paid me or anything!"
 VIET_creepy_courtier_ignore: "My courtiers may not approve, but seriously now, I have better things to do than deal with a silly drama."
 egyptian.176.title: "Escaping the Curse"
 egyptian.176.desc: "The [paramour.GetWomanMan] who was the object of [creepy_courtier.GetFirstName]’s obsession has gone missing. A few concerned courtiers searched for [paramour.GetHerHim], but found no sign of [paramour.GetHerHim].\n\nEventually, at my court’s insistence, I search [creepy_courtier.GetFirstNameNoTooltip]’s quarters, and find magic charms and other suspicious scrolls, but nothing to make a good case on.\n\n[paramour.GetFirstName] might have just ran away, but [paramour.GetSheHe]’ll be back... right?"
 egyptian.176.a: "[paramour.GetSheHe|U] never came back."
 egyptian.176.b: "That much is certain."
 egyptian.176.c: "Ammit has no fury like a lover scorned."
 egyptian.177.title: "More Magics?"
 egyptian.177.desc: "A little after the situation with [creepy_courtier.GetFirstName] was taken care of, it comes to my attention that [paramour.GetFirstName] [paramour.GetHerselfHimself] has been praying a lot.\n\nTo my surprise, it is not a plea to the likes of [ROOT.Char.GetFaith.HouseholdGodName] or [ROOT.Char.GetFaith.HighGodName] to protect [paramour.GetHerHis] from further harm. I learn from the other servants that [paramour.GetSheHe] was praying to Hathor for love."
 egyptian.177.desc.attracted: "\n\nWhen questioned, [paramour.GetSheHe] shyly admits [paramour.GetSheHe]’s been eyeing me for a while, and punishment of [paramour.GetHerHis] tormentor has made [paramour.GetHerHis] love for me grow even more."
 egyptian.177.desc.attracted_root: "\n\nGiven [paramour.GetSheHe] is a pretty, bright young [paramour.GetWomanMan], this is flattering. As a mighty [ROOT.Char.GetTitleTierName], I could easily take [paramour.GetHerHim] as my lover."
 egyptian.177.a: "I cannot. But I will treat [paramour.GetHerHim] kindly nevertheless."
 egyptian.177.a.non_attracted: "Nevertheless, I will treat [paramour.GetHerHim] with kindness."
 egyptian.177.b: "[paramour.GetSheHe|U] is one step away from becoming a witch! Begone!"
 egyptian.177.c: "I don’t mind having [paramour.GetHerHim] as a lover at all."
 VIET_creepy_courtier_maid_lover: "[paramour.GetSheHe|U] prayed to Hathor, who heard [paramour.GetHerHis] prayers. [paramour.GetSheHe|U] will be promoted to a [paramour.GetLadyLord] and become my lover."
 VIET_creepy_courtier_courtier: "Dark Magic in My Court"
 grudge_egyptian.176: "[TARGET_CHARACTER.GetShortUIName|U] failed to protect [CHARACTER.GetShortUIName] from the occult wiles of [TARGET_CHARACTER_2.GetUIName]."