l_english:
 # Noric events
 bp_viet.4000.title: "Noric Smiths on the Rise"
 bp_viet.4000.desc: "Centuries ago, the Noric peoples produced some of the greatest swords worldwide, thanks mostly to the quality of steel produced in the region.\n\nNowadays, the glory days of the Noric steel are long over, but recently there has been a minor revival of fortunes for the [noric_county.GetCountyData.GetCulture.GetName] steelsmiths in [noric_county.GetNameNoTier]."
 bp_viet.4000.a: "Good to hear!"
 bp_viet.4000.b: "Let's invest in these smiths."
 VIET_invest_in_eastern_noricum: "What will we say when our children ask: why didn't you invest in Noricum?"
 bp_viet.4001.title: "Legends of Noreia"
 bp_viet.4001.desc: "The old records speak of the ancient Noric capital, called Noreia. Even Julius Caesar and Pliny the Elder spoke of it. Nowadays, many generations later, no one knows where it is.\n\nSome scholars at our [ROOT.Char.Custom('GetCourt')] claim that this lost city is, in fact, located in the [noric_county.GetName], arguing some local ruins are the site of this great city."
 bp_viet.4001.a: "Amazing!"
 bp_viet.4001.b: "Such a claim is preposterous."
 bp_viet.4001.c: "I find this unlikely, because..."
 bp_viet.4002.title: "Fragrant Saliunca"
 bp_viet.4002.desc: "The plant known as Saliunca has always been a popular as an ingredient for perfume among the Noric peoples for centuries.\n\nToday, a few [gifter.GetCulture.GetName] dignitaries offered everyone in my [ROOT.Char.Custom('GetCourt')] some Saliunca-based perfume as a gift on behalf of [gifter.GetCharacterViewName]."
 bp_viet.4002.a: "Very well!"
 bp_viet.4002.b: "We cannot accept such vanities."
 bp_viet.4003.title: "Gentian Herbs"
 bp_viet.4003.desc: "Today, a number of [gifter.GetCulture.GetName] lords are visiting your [ROOT.Char.Custom('GetCourt')]. [gifter.GetCharacterViewName] presents you a small gift of the leaves and roots of the Gentian plant, for your health and well-being.\n\nGentian is said to help with various minor health problems in traditional Noric herbalism."
 bp_viet.4003.a: "Thank you."

 # Bosporan events
 bp_viet.4004.title: "Bosporan Barbarians"
 bp_viet.4004.desc: "It is said that even in ancient times, our Hellenic brethren have looked down upon the Greeks of the Bosporus as being uncultured.\n\nWhy, today, a traveler from Greece said as much about us [ROOT.Char.GetCulture.GetCollectiveNoun] in front of my [ROOT.Char.Custom('GetCourt')]. [traveler.GetName] said we have mixed for too long with the nomadic barbarians of the steppes like the Scythians and Sarmatians. It's true, but even then, [traveler.GetSheHe] is being rude."
 bp_viet.4004.a: "We have much to learn from others, even barbarians."
 bp_viet.4004.b: "We still have Greek roots, no matter what!"
 bp_viet.4004.c: "[traveler.GetSheHe|U]'s not wrong - our roots have been corrupted."
 bp_viet.4004.d: "These squabbles over identity are pointless."
 bp_viet.4005.title: "Ceramic Arts"
 bp_viet.4005.desc: "I need some new pottery for my household. Typically, [ROOT.Char.GetCulture.GetCollectiveNoun] have had two styles of ceramics and decor for centuries.\n\nOne is drawn from our Hellenic roots, particularly that of the Athenians who used to be a big presence in the Bosporus.\n\nThe other is mixed, incorporating elements from our Scythian and Sarmatian neighbors. I will tell the servants to buy pottery of..."
 bp_viet.4005.a: "The Attic style. We are still Greeks, after all."
 bp_viet.4005.a.non_greek: "The Hellenic style. Few traditions command more grandeur."
 bp_viet.4005.b: "The mixed [ROOT.Char.GetCulture.GetNameNoTooltip] style. It represents our diverse society."
 bp_viet.4005.c: "Both styles - best of both worlds!"
 bp_viet.4005.c.outcome: "You purchase multicultural pottery"
 bp_viet.4006.title: "Grave Goods"
 bp_viet.4006.desc: "In the [tomb_county.Custom('TerrainTypeCountyScopePlural')] of [tomb_county.GetNameNoTier], locals stumbled on an old burial mound. It does not appear to belong to the Scythian nomads, but an ancient [GetCultureByKey('bosporan').GetName] nobleman!\n\nWhoever was buried here must not have been too powerful or rich, as it is rather modest in size. Still, even the humblest of these barrows often hold jewelry, silver vases, ancient weapons, exquisite clothing, and more. Should we disturb the dead and loot the riches held here?"
 bp_viet.4006.a: "No. Do not disturb the dead."
 bp_viet.4006.b: "Yes, pay some men to search it."
 bp_viet.4007.title: "Your men loot the mound..."
 bp_viet.4007.desc: "Your men looted through the old Bosporan burial mound and managed to find some goods."
 bp_viet.4007.a: "A disappointing result. A waste of time!"
 bp_viet.4007.b: "A mediocre result. But better something than nothing."
 bp_viet.4007.c: "A good result. You made a bit of coin selling these!"
 bp_viet.4007.d: "A great result. Who knew this place held so much?"
 bp_viet.4008.title: "Maritime Trade"
 bp_viet.4008.desc: "The [ship_county.GetCountyData.GetCulture.GetName] shipowning guilds have made a number of sound investments lately, resulting in the economy of [ship_county.GetNameNoTier] growing quite a bit."
 bp_viet.4008.a: "Good, good."
 bp_viet.4009.title: "Legends of the Tauri"
 bp_viet.4009.desc: "I am reading about the legendary Tauri, who once lived in [GetCultureByKey('bosporan').GetName] lands and gave the region of Taurica its name.\n\nUnlike the reasonable Scythians, they were savages who sacrificed shipwrecked travelers to their virgin goddess by decapitating their victims and nailing their heads onto wooden poles to supposedly ward off evil. How ironic that they were the evil ones!"
 bp_viet.4009.a: "Thank [ROOT.Char.GetFaith.random_GoodGodNames] we live in more civilized times."
 bp_viet.4009.b: "These stories must be made-up."
 bp_viet.4010.title: "Another Glass"
 bp_viet.4010.desc: "Since ancient times, [culture.GetCollectiveNoun] have always had a strong liking for Greek wine. Local [culture.GetNameNoTooltip] leaders in [county.GetNameNoTier] have asked me to invest some funds to help merchants import more Greek wine to feed the locals' desire."
 bp_viet.4010.a: "Will do."
 bp_viet.4010.b: "Our resources are better spent elsewhere."

 # Corduenian events
 bp_viet.4011.title: "A Genial Visage"
 bp_viet.4011.desc: "A group of [traveler.GetCulture.GetName] travelers are visiting my court this week.\n\nAccording to their legends, we are the descendants of five hundred handsome djinn and five hundred beautiful maidens.\n\n[traveler.GetName] says these tales have much merit given how [traveler.GetSheHe] has now seen so many fine-looking [ROOT.Char.GetCulture.GetCollectiveNoun]."
 bp_viet.4011.a: "Yes, indeed we are quite good-looking people!"
 bp_viet.4011.b: "Every nation has their share of fine folk."
 bp_viet.4011.c: "Such stories are exaggerations and lies."
 bp_viet.4011.d: "Are you trying to get something out of me with this flattery?"
 bp_viet.4012.title: "No Wall Too High"
 bp_viet.4012.desc: "Some of my military officials are recommending that I hire a [culture.GetName] siege expert. For centuries, they were known for being quite capable in the construction and destruction of fortifications. It would not be too much a hassle to find a capable servant somewhere."
 bp_viet.4012.a: "Yes, let's go find one!"
 bp_viet.4012.b: "No, I have no need."
 bp_viet.4013.title: "Solomon's Seduction"
 bp_viet.4013.desc: "Legends say King Solomon sent five hundred djinn to find him five hundred beautiful virgins to add to his harem, but Solomon died once the djinn did this, so the djinn and the maidens married each other and gave birth to the [culture.GetName] race.\n\nThus, many [culture.GetCollectiveNounNoTooltip] in my realm are said to be good-looking and I agree. I've been thinking of finding one to be a bed warmer..."
 bp_viet.4013.a.female: "Look for a lowly, [culture.GetNameNoTooltip] [maid.Custom('lowly_servant_type')] to be my mistress."
 bp_viet.4013.a.male: "Look for a lowly, [culture.GetNameNoTooltip] [maid.Custom('lowly_servant_type')] to be my paramour."
 bp_viet.4013.b: "This is a waste of time and resources better spent elsewhere."
 bp_viet.4013.c: "I'd rather study these stories and legends."
 bp_viet.4013.d: "What's so special about the [culture.GetCollectiveNounNoTooltip]?"
 bp_viet.4014.title: "The Old Hillfort"
 bp_viet.4014.desc: "We are traveling through [ROOT.Char.GetCurrentLocation.GetName] when we pass by an ancient [GetCultureByKey('corduenian').GetName] fortress. The peoples of Corduene are renowned as the foremost siege experts and engineers of the world.\n\nEven though this particular fort is abandoned and in ruins,\nI can see how it would have been a fearsome sight to behold centuries ago in its heyday."
 bp_viet.4014.a: "From this castle, a lord could easily control the surrounding area."
 bp_viet.4014.b: "But it is no longer in use - I wonder why is that?"
 bp_viet.4015.title: "Now Hiring"
 bp_viet.4015.desc: "[culture.GetName] builders have always been renowned for their abilities to build anything quickly and effectively, even back in the days of the ancient Hellenes.\n\nThere are a number of important projects planned throughout my realm, and my advisors suggest it might be wise to utilize some [culture.GetNameNoTooltip] craftsmen like [engineer.GetName]."
 bp_viet.4015.a: "A good idea!"
 bp_viet.4015.b: "We have no need for [engineer.GetNamePossessiveNoTooltip] services."

 # Ancient cultures
 bp_viet.260.title: "Lost in the Weeds"
 bp_viet.260.desc: "Some peasants have discovered the ruins of an old Roman temple while digging in their fields.\n\nWhile most of the temple is ruined beyond repair, the peasants discovered the statue of a pagan goddess. It is beautiful beyond description and lifelike — the statue looks like it could move at any moment!"
 bp_viet.260.a: "$hellenic.539.a$"
 bp_viet.260.b: "$hellenic.539.c$"
 bp_viet.260.c: "I should study it... such craftsmanship!"
 bp_viet.260.d: "Destroy that heathen statue!"
 bp_viet.261.title: "Heroic Remnants"
 bp_viet.261.desc: "While traveling through [ROOT.Char.GetCurrentLocation.GetName], I come across an ancient monument from before the time of Jesus and even the great Parthian houses.\n\n[entourage_helper.GetName] tells me that this monument probably came from the Heroic Age, during the time of great men like Rostam and Esfandiyar."
 bp_viet.261.a: "So this is even more ancient than our Sassanian forebears..."
 bp_viet.261.b: "Tell me more about this Heroic Age."
 bp_viet.262.title: "Scythian Gold"
 bp_viet.262.desc: "My excursion through the steppes is interrupted when I notice some gold on the ground.\n\nDigging more deeply, I find a burial mound full of gold art and jewelry. Perhaps this was left over by one of the ancient steppe peoples, like the Scythians?"
 bp_viet.262.a: "I see a gold comb... a gold dagger... a gold figurine..."
 bp_viet.263.title: "Buddhas of Bamian"
 bp_viet.263.desc: "Traveling through the mountainous terrain of [ROOT.Char.GetCurrentLocation.GetName], I notice large, ancient statues carved into the mountainside some distance ahead.\n\n[entourage_helper.GetName] says "The locals call it #italic sork-bot#! and #italic keng-bot#! — the red idol and the white idol, as they were worshipped by the Buddhists.""
 bp_viet.263.a: "What an impressive sight."
 bp_viet.263.b: "The disgusting things [ROOT.Char.Custom('GetUnbelieverNamePlural')] do to beguile the masses!"
 bp_viet.264.title: "Mystery of the Henges"
 bp_viet.264.desc: "The large stones that dot my realm's landscape, called henges, have always puzzled me.\n\nToday [scholar.GetCharacterViewName], a learned scholar, is visiting my court, and I asked [scholar.GetHerHim] about them.\n\n"The henges are ancient monuments built by the Celts of Brittania and Gaul ages ago," [scholar.GetSheHe] tells me."
 bp_viet.264.a: "Interesting."
 bp_viet.264.b: "They seem to be astrologically aligned, can you explain that?"
 bp_viet.265.title: "Fallen Hawelti"
 bp_viet.265.desc: "Near one of the villages in the [county.GetName] is a large stele, dating back centuries to when the great Kingdom of Axum ruled the region.\n\nNews has come to my court, however, that this #italic hawelti#! has recently collapsed, leading to some property damage."
 bp_viet.265.a: "How unfortunate."
 bp_viet.265.b: "Thank [ROOT.Char.GetFaith.random_GoodGodNames] that outdated absurdity is destroyed!"
 bp_viet.265.c: "Send aid to the villagers."

 # Modifiers
 VIET_noric_smiths: "Noric Steelsmiths"
 VIET_noric_smiths_desc: "Though Noric steel is no longer as prized as it used to be, the steelsmiths of this province have had a revival of fortunes recently."
 VIET_noric_legendary_capital: "Lost City of Noreia"
 VIET_noric_legendary_capital_desc: "Whether true or not, some believe that certain ruins located in this region are the last vestiges of the legendary Noreia, lost city of the ancient Noric people."
 VIET_saliunca_perfume: "Saliunca Perfume"
 VIET_gentian_herb: "Gentian Herb"
 VIET_gentian_herb_desc: "An ancient Noric herb, said to help with various medical issues like fever, digestive problems, wounds, malaria, and more."
 VIET_learn_from_steppe_nomads: "Respect for Steppe Nomads"
 VIET_learn_from_steppe_nomads_desc: "This character recognizes that the steppe nomads are not to be trifled with, and there is much that settled, civilized peoples can learn from them."
 VIET_proud_mixed_greek: "Proud Mixed Greek"
 VIET_proud_mixed_greek_desc: "This character claims ancestry from both Greeks and barbarians, and is proud of it, seeing that they have inherited the best of both worlds."
 VIET_bosporan_shipowner_cool: "Prosperous Shipowners' Guild"
 VIET_bosporan_shipowner_cool_desc: "For many years, the shipowners' guild has been at the forefront of business and commerce. Their recent activities in this province have proven fruitful."
 VIET_thankful_legends: "Thankful for the Present"
 VIET_thankful_legends_desc: "After reading some stories about how terrible life was for the brutish, filthy, troglodytes of bygone eras, this character is much more thankful for living in such a relatively civilized and peaceful era."
 VIET_greek_wine_imports: "Greek Wine Imports"
 VIET_greek_wine_imports_desc: "$cretan_muscat$, $macedonian_wine$, $byzantine_cypriot$. No expense has been spared in indulging a taste for Greek wine."
 VIET_hiring_corduenian_builders: "Hiring Corduenian Builders"
 VIET_hiring_corduenian_builders_desc: "The Corduenians are famous for being some of the best engineers and constructors in the world. This character has hired a number of them to assist in various projects in their realm."
 VIET_destroyed_axum_stele: "Collapsed Stele"
 VIET_destroyed_axum_stele_desc: "An Axumite hawelti has fallen in this province due to an earthquake."