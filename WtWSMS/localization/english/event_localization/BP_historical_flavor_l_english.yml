l_english:
 #Vandals have slaves
 bp_historical_flavor.0001.name: "Sack of Rome"
 bp_historical_flavor.0001.desc: "Following the [ROOT.Char.GetCulture.GetCollectiveNoun]' Sack of Rome in 455, we took countless [GetCultureByKey('roman').GetName] citizens with us back to Africa to sell off in the lucrative slave markets."
 bp_historical_flavor.0001.a: "#italic Servus non habet personam#!"
 
 #Gain Roman Nostalgia
 bp_historical_flavor.0002.name: "Imperial Legacy"
 bp_historical_flavor.0002.desc: "It's hard to ignore the legacy of the ancient Romans, from how they administered their land with their great code of laws, to how they defeated the mighty Carthagians, Greeks, Gauls and Persians with their advanced military strategies.\n\nAs a [ROOT.Char.GetCulture.GetName], many consider my rule to be in continuity to that of the Romans of old. Perhaps we may learn something from their legacy?"
 bp_historical_flavor.0002.a: "If I am to follow those great statesmen, I shall study the classics."
 bp_historical_flavor.0002.b: "We must look to [ROOT.Char.GetFaith.HighGodName] if we are to find glory."