l_english:
 raise_circumcellions_decision: "Raise #italic Agonistici#!"
 raise_circumcellions_decision_confirm: "Confirm"
 raise_circumcellions_decision_desc: "Roving bands of Donatists have for long been a problem for the rulers of Northern Africa who do not adhere to their doctrine. As a Donatist ruler, you may enlist these bands in your service at piety cost for the cause of the religion in the ongoing war."
 raise_circumcellions_decision_tooltip: "Raises some levies and light infantry for the current war, at the cost of county control"
 reaffirm_faith_decision: "Reaffirm Faith"
 reaffirm_faith_decision_confirm: "I reaffirm my faith!"
 reaffirm_faith_decision_desc: "As I have adopted [GetTenetType('tenet_credobaptism').GetBaseName] as a personal belief, I have the opportunity to affirm my faith, strengthening my commitment to the divine."
 reaffirm_faith_decision_tooltip: "Reaffirm your faith, spending [piety|E] to increase [spiritual_fulfillment|E]"
 #Tooltips and effects
 reaffirm_faith_factors: "#weak Your [spiritual_fulfillment|E] is increased for every [virtue|E] you embody, and decreased even more for every [sin|E] you have.\nThe greater your [piety_level|E], the more the sins weigh on you and the less your virtues help you.\n[GetTrait('zealous').GetName( GetNullCharacter )] characters magnify both the weight of sins and virtues and increases the base [spiritual_fulfillment|E] provided, while [GetTrait('fickle').GetName( GetNullCharacter )] or [GetTrait('eccentric').GetName( GetNullCharacter )] characters add to the base [spiritual_fulfillment|E] of the #V $reaffirm_faith_decision$#!\nMinimum [spiritual_fulfillment|E] gain for this decision is @spiritual_fulfillment_icon!#P 5#!#!"
 at_least_on_county_is_your_rite: "At least one county in your [domain|E] is your [rite|E]"
 no_effect: "As there is no [county|E] in your realm that is your [rite|E], this decision cannot be taken"
 circumcellions_army_name: "Circumcellions"
 circumellions_raised_title: "Circumcellions Raised!"
 circumellions_raised_desc: "[circumellions_raiser.GetName] has raised Circumcellions in [circumellions_raiser.GetHerHim] current wars, adding more soldiers to [circumellions_raiser.GetHerHim]."
 circumellions_raised_tt: "[circumellions_raiser.GetName] raised [circumellions_raiser.MakeScope.ScriptValue('num_raised_circumcellions_levies')] levies and [circumellions_raiser.MakeScope.ScriptValue('num_raised_circumcellions_infantry')] light infantry."
 
