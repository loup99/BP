l_english: #NB: This is only for non-Alanic because of the transition from d to l in Pontic Scythian that Alanic did not undergo
 #Orthography notes:
 # * Inherits þ/Þ usage from Gothic for the voiceless dental frictive "Th"
 # * Kh for the Voiceless postalveolar affricative "Ch"
 # * X for the Voiceless Velar Frictive
 # * cs replaces ks for orthography.
 #
 #   Basically the Sarmatians end up using k, x, and þ in their own alphabet, displacing some Latin 
 #   Orthography to adapt for the otherwise unknown sounds in Latin.
