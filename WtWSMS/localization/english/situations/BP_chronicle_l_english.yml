l_english:
 situation_group_type_chronicle: "Chronicle"
 
 situation_BP_chronicle: "Chronicle"
 situation_BP_chronicle_desc: "The Chronicle records major events in world history."
 situation_type_BP_chronicle: "$situation_BP_chronicle$"
 situation_type_BP_chronicle_desc: "$situation_BP_chronicle_desc$"
 
 BP_chronicle_default_situation_phase: "When the World Stopped Making Sense"
 BP_chronicle_default_situation_phase_desc: "$situation_BP_chronicle_desc$"
 
 
 situation_chronicle_start_history_entry: "This is the chronicle of [GetPlayer.GetPrimaryTitle.GetDefinitiveName], in which is contained the record of the world's fortunes, glories, and difficulties."
 
 ### General History Effects
 situation_chronicle_title_created_entry: "[SituationHistoryEntry.GetVariable('char').Char.GetTitledFirstName] founded [SituationHistoryEntry.GetVariable('title').Title.GetDefinitiveName]."
 situation_chronicle_title_restored_entry: "[SituationHistoryEntry.GetVariable('char').Char.GetTitledFirstName] restored [SituationHistoryEntry.GetVariable('title').Title.GetDefinitiveName]."
 situation_chronicle_title_reunified_entry: "[SituationHistoryEntry.GetVariable('char').Char.GetTitledFirstName] reunified [SituationHistoryEntry.GetVariable('title').Title.GetDefinitiveName]."
 
 situation_chronicle_title_destroyed_cause_entry: "[SituationHistoryEntry.GetVariable('char').Char.GetTitledFirstName] dismantled [SituationHistoryEntry.GetVariable('title').Title.GetDefinitiveName]."
 situation_chronicle_title_destroyed_death_entry: "With the passing of [SituationHistoryEntry.GetVariable('char').Char.GetTitledFirstName], [SituationHistoryEntry.GetVariable('title').Title.GetDefinitiveName] collapsed." #For hegemonic collapse
 situation_chronicle_title_destroyed_china_entry: "[SituationHistoryEntry.GetVariable('title').Title.GetBaseNameNoTier|U] fell to division."
 situation_chronicle_title_destroyed_entry: "[SituationHistoryEntry.GetVariable('title').Title.GetDefinitiveName|U] was destroyed."
 
 situation_chronicle_culture_diverged_entry: "[SituationHistoryEntry.GetVariable('culture').Culture.GetName] diverged from [SituationHistoryEntry.GetVariable('parent1').Culture.GetName]."
 situation_chronicle_culture_hybrid_entry: "[SituationHistoryEntry.GetVariable('culture').Culture.GetName] formed from [SituationHistoryEntry.GetVariable('parent1').Culture.GetName] and [SituationHistoryEntry.GetVariable('parent2').Culture.GetName]."
 situation_chronicle_culture_jewish_diaspora_entry: "[SituationHistoryEntry.GetVariable('culture').Culture.GetName] formed from the [GetCultureByKey('israelite').GetName] diaspora in [SituationHistoryEntry.GetVariable('title').Title.GetNameNoTier]."
 
 situation_chronicle_faith_created_entry: "[SituationHistoryEntry.GetVariable('char').Char.GetTitledFirstName] founded [SituationHistoryEntry.GetVariable('faith').Faith.GetName]."
 situation_chronicle_faith_reformed_entry: "[SituationHistoryEntry.GetVariable('char').Char.GetTitledFirstName] reformed [SituationHistoryEntry.GetVariable('faith').Faith.GetName]."
 
 situation_chronicle_ghw_win_entry: "[SituationHistoryEntry.GetVariable('faith').Faith.GetAdjective] forces lead by [SituationHistoryEntry.GetVariable('attacker').Char.GetTitledFirstName] triumphed in a [SituationHistoryEntry.GetVariable('faith').Faith.GHWName] for [SituationHistoryEntry.GetVariable('title').Title.GetNameNoTier]."
 situation_chronicle_ghw_lose_entry: "[SituationHistoryEntry.GetVariable('defender').Char.GetName] defended victoriously against a [SituationHistoryEntry.GetVariable('faith').Faith.GHWName]."
 
 ### Default Decisions
 situation_chronicle_split_roman_empire_entry: "[SituationHistoryEntry.GetVariable('west_char').Char.GetTitledFirstName] split off [GetTitleByKey('h_eastern_roman_empire').GetDefinitiveName|l] to the #italic imperium#! of [SituationHistoryEntry.GetVariable('char').Char.GetTitledFirstName]."
 situation_chronicle_title_india_entry: "[SituationHistoryEntry.GetVariable('char').Char.GetTitledFirstName] united [SituationHistoryEntry.GetVariable('title').Title.GetBaseNameNoTier]."
 situation_chronicle_trait_conqueror_entry: "[SituationHistoryEntry.GetVariable('char').Char.GetTitledFirstName] became a [GetTrait('conqueror').GetName(GetNullCharacter)]."
 situation_chronicle_trait_greatest_khan_entry: "[SituationHistoryEntry.GetVariable('char').Char.GetTitledFirstName] became the [GetTrait('greatest_of_khans').GetName(GetNullCharacter)]."

 ### WtWSMS History
 situation_chronicle_fall_of_rome_entry: "The city of [GetTitleByKey('c_roma').GetBaseNameNoTier] fell to the barbarian invader [SituationHistoryEntry.GetVariable('char').Char.GetFirstName]."
 situation_chronicle_persia_legalizes_caucasian_christianity_entry: "[SituationHistoryEntry.GetVariable('char').Char.GetName] granted legal rights to the Christian faiths of the Caucasus."
 situation_chronicle_reestablished_albania_entry: "Vachagan III is crowned as king of Albania."
 situation_chronicle_battle_of_tolbiac_entry: "At the battle of [SituationHistoryEntry.GetVariable('title').Title.GetBaseNameNoTier], [SituationHistoryEntry.GetVariable('char').Char.GetTitledFirstName] placed [SituationHistoryEntry.GetVariable('char').Char.GetHerHis] faith in [SituationHistoryEntry.GetVariable('faith').Faith.GetName] and achieved a miraculous victory."
 situation_chronicle_sole_roman_empire_entry: "[SituationHistoryEntry.GetVariable('char').Char.GetTitledFirstName] abolished [SituationHistoryEntry.GetVariable('other_title').Title.GetDefinitiveName|l], consolidating [SituationHistoryEntry.GetVariable('title').Title.GetDefinitiveName|l] as the sole Roman Empire."
 situation_chronicle_disband_senate_entry: "[SituationHistoryEntry.GetVariable('char').Char.GetName] disbanded the Senate in [SituationHistoryEntry.GetVariable('title').Title.GetBaseNameNoTier]."
 situation_chronicle_restore_senate_entry: "[SituationHistoryEntry.GetVariable('char').Char.GetName] reestablished the Senate in [SituationHistoryEntry.GetVariable('title').Title.GetBaseNameNoTier]."
 situation_chronicle_senate_collapsed_entry: "The [SituationHistoryEntry.GetVariable('title').Title.GetAdjective] Senate was abandoned."
 
 #Migration Situation history
 situation_chronicle_successful_migration_entry: "The [SituationHistoryEntry.GetVariable('char').Char.GetCulture.GetCollectiveNoun] under [SituationHistoryEntry.GetVariable('char').Char.GetTitledFirstName] #bold successfully#! migrated to [SituationHistoryEntry.GetVariable('title').Title.GetNameNoTierNoTooltip|U] from [SituationHistoryEntry.GetVariable('old_title').Title.GetNameNoTierNoTooltip|U]."
 situation_chronicle_failed_migration_entry: "The [SituationHistoryEntry.GetVariable('char').Char.GetCulture.GetCollectiveNoun] under [SituationHistoryEntry.GetVariable('char').Char.GetTitledFirstName] #italic failed#! to migrate to [SituationHistoryEntry.GetVariable('title').Title.GetNameNoTierNoTooltip|U] from [SituationHistoryEntry.GetVariable('old_title').Title.GetNameNoTierNoTooltip|U]."
 situation_chronicle_successful_migration_entry_internal: "The [SituationHistoryEntry.GetVariable('char').Char.GetCulture.GetCollectiveNoun] under [SituationHistoryEntry.GetVariable('char').Char.GetTitledFirstName] #bold successfully#! migrated within [SituationHistoryEntry.GetVariable('title').Title.GetNameNoTierNoTooltip|U]."
 situation_chronicle_failed_migration_entry_internal: "The [SituationHistoryEntry.GetVariable('char').Char.GetCulture.GetCollectiveNoun] under [SituationHistoryEntry.GetVariable('char').Char.GetTitledFirstName] #italic failed#! to migrate within [SituationHistoryEntry.GetVariable('title').Title.GetNameNoTierNoTooltip|U]."
 
 situation_chronicle_passed_cultural_law_entry: "[SituationHistoryEntry.GetVariable('char').Char.GetTitledFirstName] passed a set of laws governing the relationship between the [SituationHistoryEntry.GetVariable('char').Char.GetCulture.GetCollectiveNoun] and the Romans."
 
 situation_chronicle_celebrated_2000_anniversery_of_gothic_kingdom_entry: "[SituationHistoryEntry.GetVariable('char').Char.GetTitledFirstName] passed a proclamation celebrating the putative 2000th anniversary of the founding of the Gothic Kingdom, greatly strengthening the [dynasty_prestige_level|E] of the [SituationHistoryEntry.GetVariable('char').Char.GetDynasty.GetBaseName] Dynasty"
 
 #Roman Empire Reformation Events
 situation_chronicle_asked_for_roman_empire_entry: "[SituationHistoryEntry.GetVariable('char').Char.GetTitledFirstName] received the [SituationHistoryEntry.GetVariable('title').Title.GetName|U] after recognition from [SituationHistoryEntry.GetVariable('grantor').Char.GetTitledFirstName]"
 situation_chronicle_restored_empire_entry: "[SituationHistoryEntry.GetVariable('char').Char.GetTitledFirstName] reformed the [SituationHistoryEntry.GetVariable('title').Title.GetName|U] by reuniting the core lands of [SituationHistoryEntry.GetVariable('title').Title.GetNameNoTierNoTooltip|U] under [SituationHistoryEntry.GetVariable('char').Char.GetHerHis] rule!"
 situation_chronicle_asked_for_hre_entry: "While the vestiges of Roman rule have decayed in the West, [SituationHistoryEntry.GetVariable('grantor').Char.GetTitledFirstName] has recognized [SituationHistoryEntry.GetVariable('char').Char.GetTitledFirstName] as the ruler of a new successor state, the [SituationHistoryEntry.GetVariable('title').Title.GetName|U] by right of [Glossary('#italic Translatio Imperii#!','TRANSLATIO_IMPERII_GLOSS')]"
 TRANSLATIO_IMPERII_GLOSS: "Latin for \"Transfer of Rule\", it represents the idea in medieval and antique Europe that the fall of one empire is replaced by a natural succession to another. This was cited as part of the justification for the creation of the Holy Roman Empire."
 situation_chronicle_unite_roman_empires_entry: "Under the rule of [SituationHistoryEntry.GetVariable('char').Char.GetTitledFirstName], both the [Glossary('#italic Pars Occidentalis#!','PART_WEST_GLOSS')] and [Glossary('#italic Pars Orientalis#!','PART_EAST_GLOSS')] of the [SituationHistoryEntry.GetVariable('title').Title.GetName|U] have been reunited into a single empire again."
 