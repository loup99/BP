 reduces_chance_subroman_administrative_vassals_increase_aristocracy: "[SelectLocalization( HasDlcFeature( 'landless_playable' ), '#EMP Decreases#! the chance that #V $subroman_administrative_government|q$#! vassals achieve more aristocratic inheritance laws', 'BLANK' )]"
 BLANK: ""
 #Military Innovations
 innovation_primitive_leverage: "Primitive Leverage"
 innovation_primitive_leverage_desc: "A catapult operates on simple principles, put into practice with taught ropes and swinging beams."
 innovation_castrae: "Earthworks" #from innovation_motte
 innovation_castrae_desc: "Simple yet effective, building our encampments on raised earthen mounds is the best way to ensure we quite literally have the high ground over our enemies."
 innovation_earthworks_celtic: "Henges"
 innovation_earthworks_celtic_desc: "$innovation_castrae_desc$"
 unlocks_first_level_walls: "Unlocks the first level of [fortification_buildings|E]"
 innovation_tribal_warfare: "Tribal Warfare"
 innovation_tribal_warfare_desc: "Though their scale may seem small compared to more sophisticated societies, closely-knit tribes are able to mobilize much of their population."
 unlocks_first_level_military_buildings: "Unlocks the first level of [military_buildings|E]"
 unlocks_raid_wars: "[SelectLocalization( HasDlcFeature( 'the_fate_of_iberia' ), 'UNLOCKS_RAID_WARS', 'BLANK' )]"
 UNLOCKS_RAID_WARS: "Unlocks Raid Wars [casus_belli|E]"
 #Civic Innovations
 innovation_development_bp_00: "Land Clearing"
 innovation_development_bp_00_desc: "Forest clearance is the first step in developing farms and settlements."
 unlocks_first_level_economic_buildings: "Unlocks the first level of [economic_buildings|E]"
 reduce_develop_county_penalty_bp_00: "Counties now reach the maximum [existing_development|E] penalty at 10 [development|E]"
 innovation_barter: "Barter"
 innovation_barter_desc: "Barter is the most primitive means of exchanging goods between groups, with the value of goods evaluated relative to each other."
 innovation_oppidum: "Hillforts"
 innovation_oppidum_desc: "Building settlements at well-defended locations allows them to flourish as sites of commerce and politics."
 innovation_oppidum_celtic: "Oppidum"
 innovation_oppidum_celtic_desc: "An Oppidum is an large fortified site, most commonly associated with the urban centers of Celtic culture."
 innovation_leges_barbarorum: "Oral Law"
 innovation_leges_barbarorum_desc: "Passed down from elder to elder, a vast body of legal custom pertains to any dispute that may arise."
 innovation_leges_germanic: "Leges Barbarorum"
 innovation_leges_germanic_desc: "The pre-feudal 'Laws of the Barbarians' governed much of Europe between the 5th and 9th centuries, with numerous shared features such as common law."
 innovation_writing: "Writing"
 innovation_writing_desc: "Writing allows for the exchange, storage, and standardization of language and laws in both time and space and is a critical step in the development of a society."
 unlocks_all_scriptoria: "Required for all Scriptorium Buildings"
 adopt_high_tribal_government_as_a_vassal: "Enables changing [government|E] type to [high_tribal_government|E] if a liege has a more advanced government"
 high_titles_shatter_without_this_innovation: "[SelectLocalization(GetGlobalVariable('tribal_shatter_mechanic_enabled').IsSet, 'Kingdoms and Empires of tribal rulers #EMP no longer#! shatter upon death of the holder', '')]"
 innovation_social_stratification: "Social Stratification"
 innovation_social_stratification_desc: "The transition from a stateless to a state society involves the creation of a social hierarchy, which is necessary for chiefs to extend their power to their progeny."
 can_create_de_jure_kingdoms_if_settled: "Can create [de_jure|E] [kingdoms|E] with [organized_government|E] government"
 unlocks_megaliths: "Unlocks the Megalith line of buildings"
 allows_confederation_to_kingdom: "Unlocks the [GetDecision('confederation_kingdom_decision').GetName] [decision|E]"
 unlocks_domicile_buildings: "[SelectLocalization( HasDlcFeature( 'landless_playable' ), 'Unlocks the first 3 levels of administrative main domicile buildings', 'BLANK' )]
 #######################
 # Classical Antiquity #
 #######################
 #Military Innovations
 innovation_metalurgy: "Steelworking"
 innovation_metalurgy_desc: "The expansion of ferrous metallurgy has greatly impoved weapons and armor, enabling more powerful troops than before."
 innovation_conscription: "Conscription"
 innovation_conscription_desc: "A formal system of conscription, with rolls of names, is needed to muster an army from a growing population."
 innovation_conscription_latin: "Dilectus"
 innovation_conscription_latin_desc: "With the manpower demands that characterized the Middle Republic, conscription was again required to maintain the the legions."
 innovation_muri: "Walled Cities"
 innovation_muri_desc: "Comprised of both existing fortifications and new constructions, a network of walled settlements and roads is a significant milestone in urban development."
 innovation_muri_anglo_saxon: "Burgs"
 innovation_muri_anglo_saxon_desc: "$innovation_muri_desc$"
 unlocks_castle_01_for_advanced_governments: "Unlocks [castle_holding|E] for [bp_centralized_governments|E]"
 unlocks_second_level_walls: "Unlocks the second level of [fortification_buildings|E]"
 unlocks_special_walls: "Unlocks some Fortification [special_buildings|E]"
 unlocks_second_level_military_buildings: "Unlocks the second level of [military_buildings|E]"
 #Civic Innovations
 innovation_development_bp_01: "$innovation_development_01$" #Public works
 innovation_development_bp_01_desc: "$innovation_development_01_desc$"
 reduce_develop_county_penalty_bp_01: "Counties now reach the maximum [existing_development|E] penalty at 18 [development|E]"
 unlocks_second_level_economic_buildings: "Unlocks the second level of [economic_buildings|E]"
 innovation_fora: "Town Charters"
 innovation_fora_desc: "Delegating power to municipal leaders allows an expanding citizenry to better pursue commerce."
 innovation_fora_latin: "Fora"
 innovation_fora_latin_desc: "The forum was the public square at the center of any Roman city of note, providing a central location of business and public meetings."
 innovation_fora_greek: "Poleis"
 innovation_fora_greek_desc: "The ancient Hellenic city-states left a rich legacy of civic assemblies and citizen rule."
 unlocks_city_01_for_advanced_governments: "Unlocks [city_holding|E] for [bp_centralized_governments|E]"
 innovation_mundium: "Sovereignty"
 innovation_mundium_desc: "Reciprocity defines the relationship between ruler and ruled; a strong leader protects a loyal subject. We must expand our models of rule if we are to create a unified society."
 innovation_mundium_germanic: "Mundium"
 innovation_mundium_germanic_desc: "#italic Mund#!, Latinized as #italic mundium#!, is a principle in Germanic law meaning protection. The responsibility of #italic mundium#! extends from patriarch to the family as it does from king to subject."
 innovation_mundium_latin: "Imperium"
 innovation_mundium_latin_desc: "A citizen that holds #italic imperium#! has been given absolute command over a legion or territory. Though it was initially a position within the magistracy, this right has been centralized into the singular authority of the Imperator."
 innovation_mundium_arabic: "'Asabiyyah"
 innovation_mundium_arabic_desc: "A clan is only as strong as its bonds. Without solidarity, even the greatest dynasties stand no chance against a clan joined in arms."
 can_create_de_jure_empires_if_settled: "Can create [de_jure|E] [empires|E] with [organized_government|E] government"
 innovation_state_religion: "State Religion"
 innovation_state_religion_desc: "State religion is a specific religious body or creed endorsed by the state. While it has had many forms throughout the ages, it became very strongly intertwined with the state during Late Antiquity and the Migration Period."
 unlocks_temple_01_for_advanced_governments: "Unlocks [temple_holding|E] for [bp_centralized_governments|E]"
 innovation_state_religion_effect: "Enables [faith_reformation|E] and [faith_creation|E]"
 innovation_state_religion_can_demand_vassal_conversion: "Can [demand_conversion|E] of [organized_government|E] [vassals|E] with [organized|E] [faiths|E]"
 innovation_state_religion_allows_organized_conversion: "If the [top_liege|E]'s [culture|E] has this innovation, the [top_liege|E] and [vassals|E] may convert counties of [organized_government|E] [vassals|E] with different faiths"
 innovation_state_religion_enables_state_faith_conversion_bonus: "Realms with a [state_faith|E] now have a conversion bonus for converting [counties|E] to that [faith|E]"
 #Cultural Innovations
 reduce_develop_county_penalty_special_urbanizations: "Counties now reach the maximum [existing_development|E] penalty at 50 [development|E]"
 innovation_roman_administration: "Roman Administration"
 innovation_roman_administration_desc: "Roman government had a lasting impact on cultures throughout Europe and the Mediterranean Sea, influencing religion, culture, politics, language, and economics well beyond its borders."
 roman_government_effect: "Unlocks the [GetDecision('convert_to_roman_government_decision').GetName] [decision|E]"
 innovation_roman_concrete: "Roman Concrete"
 innovation_roman_concrete_desc: "Roman concrete, or #italic opus caementicium#!, was a material used for construction in Ancient Rome, particularly in Rome's many enduring monuments such as the Pantheon."
 unlocks_foederati_contract_for_roman_administrative: "Unlocks the #high Foederatus#! tributaries with Roman Governments"
 innovation_marzban: "Marzban"
 innovation_marzban_desc: "Marzban were a class of margraves in both the Parthian and Sassanid Empires."
 unlock_marzban_contract: "Unlocks the #high $special_contract_marzban_short$#! [feudal_contract|E]"
 innovation_wuzurgan: "Wurzugan"
 innovation_wuzurgan_desc: "Wurzugan were the high nobility in the Sassanid aristocracy, who had a prominent role in Sassanian political and religious life."
 innovation_persian_urbanization: "Persian Urbanization"
 innovation_persian_urbanization_desc: "Sassanian government emphasized the need for a strong central government, lending itself to encouraging urbanization as a means of increasing the power of the Shahanshah."
 innovation_indian_urbanization: "Indian Urbanization"
 innovation_indian_urbanization_desc: "While language and religion may have changed, administration and urbanization remained constants of civilizations in the Indian subcontinent."
 innovation_chinese_urbanization: "Chinese Urbanization"
 innovation_chinese_urbanization_desc: "China was one of the early centres of agriculture and as such has a long history of urbanization."
 innovation_ancient_urbanites: "Ancient Urbanization"
 innovation_ancient_urbanites_desc: "This culture has been urbanized for millennia and understands how to build cities more intuitively than those who more recently developed urbanization."
 #For various urbanization effects
 very_early_urbanization_effect: "Unlocks first 4 levels of buildings\n$EFFECT_LIST_BULLET$Unlocks first level of Duchy Buildings\n$EFFECT_LIST_BULLET$Can build [holdings|E]\n$EFFECT_LIST_BULLET$With sufficient development, can build level two holdings in the $culture_era_classical_antiquity$ Era and $culture_era_late_antiquity$ Era"
 ##################
 # Late Antiquity #
 ##################
 #Military Innovations
 innovation_hereditary_soldiers: "Hereditary Soldiers"
 innovation_hereditary_soldiers_desc: "With the ever-increasing scale of warfare, we need to codify the rights and privileges of our warrior aristocrats."
 innovation_hereditary_soldiers_indian: "Kshatriyas"
 innovation_hereditary_soldiers_indian_desc: "$innovation_hereditary_soldiers_desc$"
 innovation_late_antique_warfare: "Late Antique Warfare"
 innovation_late_antique_warfare_desc: "With the development of newer metallurgy and changing demographic patterns, whole new warfare tactics are unleashed."
 innovation_motte_latin: "Muri"
 innovation_motte_latin_desc: "Defensive fortifications reached their zenith during late antiquity with the construction of such colossal fortifications as the Theodosian Walls in Constantinople, Hadrian's Wall in Britannia, and the Aurelian Walls in Rome."
 unlocks_castle_holding: "Unlocks [castle_holding|E]"
