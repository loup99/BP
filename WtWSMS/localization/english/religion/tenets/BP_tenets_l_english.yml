l_english:
 tenet_adaptive_greek_name: "Prosarmósimos"
 tenet_adaptive_latin_name: "Adaptabilitas"
 tenet_animal_sacrifice_desc: "Animals carry a small part of the divine and by sacrificing them to the Divine, we may earn its favor."
 tenet_animal_sacrifice_name: "Animal Sacrifices"
 tenet_bhakti_greek_name: "Theoí Prostátes"
 tenet_bhakti_latin_name: "Dii Patroni"
 tenet_complex_exegesis_desc: "[ROOT.Faith.ReligiousText] is full of allegory, with many personal interpretations. This opens up avenues for discovery of the divine, but may impede the unenlightened who follow a scholarly path."
 tenet_complex_exegesis_name: "Complex Exegesis"
 tenet_credobaptism_christian_desc: "$tenet_credobaptism_desc$"
 tenet_credobaptism_desc: "A child cannot understand the significance of being called to the faith; only those who are adults can be meaningfully inducted into the faith."
 tenet_credobaptism_gnostic_desc: "Only one who has achieved adulthood can hope to even partially grasp the reality of this world."
 tenet_credobaptism_greek_name: "Vaptismos Piston"
 tenet_credobaptism_latin_name: "Credobaptismus"
 tenet_credobaptism_name: "Believer's Baptism"
 tenet_credobaptism_valentinianism_desc: "In the name of the unknown Father of all, by Aletheia, the Mother of all, by the name which descended upon Jesus."
 tenet_ecstatic_prophecy_desc: "Our most pious followers are possessed by [ROOT.Faith.HighGodName] and are able to deliver dramatic prophecies to help guide the faithful."
 tenet_ecstatic_prophecy_name: "Ecstatic Prophecy"
 tenet_eunuch_priests_cybelian_desc: "Transforming themselves to be more like the consort of the Great Mother, eunuchs hold a special place in this faith."
 tenet_eunuch_priests_cybelian_name: "Cyebelian Priesthood"
 tenet_eunuch_priests_desc: "The pleasures of the flesh are a distraction from the divine and as such we make our priesthood renounce such things in a lasting, permanent way"
 tenet_eunuch_priests_greek_name: "Evnoúchos Ierosýni"
 tenet_eunuch_priests_latin_name: "Sacerdotium Eunuchi"
 tenet_eunuch_priests_name: "Eunuch Priesthood"
 tenet_hero_cults_desc: "This religion features many myths relating to the mortal offspring of humans and gods. These stories of these individuals blur the boundary between the mundane and divine and serve to inspire the faithful."
 tenet_hero_cults_greek_desc: "$tenet_hero_cults_desc$"
 tenet_hero_cults_greek_name: "Latreía Íroa"
 tenet_hero_cults_latin_desc: "$tenet_hero_cults_desc$"
 tenet_hero_cults_latin_name: "Cultus Heroum"
 tenet_hero_cults_name: "Hero Cults"
 tenet_mystery_religion_desc: "This faith restricts participation in its rituals to those who have become initiates. This creates a sense of prestige and community that is otherwise rare in pagan faiths."
 tenet_mystery_religion_greek_desc: "$tenet_mystery_religion_desc$"
 tenet_mystery_religion_greek_name: "Mystiriakés Latreía"
 tenet_mystery_religion_latin_desc: "$tenet_mystery_religion_desc$"
 tenet_mystery_religion_latin_name: "Cultus Mysterii"
 tenet_mystery_religion_name: "Mystery Religion"
 tenet_numerology_desc: "Numbers are deeply tied to the divine, providing us with insights that would otherwise not be available."
 tenet_numerology_greek_desc: "$tenet_numerology_desc$"
 tenet_numerology_greek_name: "Arithmología"
 tenet_numerology_latin_desc: "$tenet_numerology_desc$"
 tenet_numerology_latin_name: "Numerologia"
 tenet_numerology_name: "Numerology"
 tenet_philsophical_movement_desc: "This faith has been developed by great thinkers and philosophers, greatly raising the importance of erudition within its beliefs."
 tenet_philsophical_movement_greek_desc: "$tenet_philsophical_movement_desc$"
 tenet_philsophical_movement_greek_name: "Philosophía"
 tenet_philsophical_movement_latin_desc: "$tenet_philsophical_movement_desc$"
 tenet_philsophical_movement_latin_name: "Philosophia"
 tenet_philsophical_movement_name: "Philosophical Movement"
 tenet_pursuit_of_power_greek_name: "Epidíoxi tis Dýnamis"
 tenet_pursuit_of_power_latin_name: "Captatio Potentiae"
 tenet_redeeming_struggle_desc: "Christ came to liberate the poor, and martyrdom is our highest goal. Let us lift up our \"Israelites\" and bring about a New Jerusalem!"
 tenet_redeeming_struggle_latin_name: "Certamen Salutandum"
 tenet_redeeming_struggle_name: "Redeeming Struggle"
 tenet_rigorism_desc: "It is inconceivable that those who have denied Christ can validly administer sacraments. Only after a great penance can #italic Traditors#! be allowed back into the Church, and never again in a position of leadership."
 tenet_rigorism_latin_name: "Tutiorismus"
 tenet_rigorism_name: "Rigorism"
 tenet_ritual_celebrations_greek_name: "Teletourgikoí Eortasmoí"
 tenet_ritual_celebrations_latin_name: "Celebrationes Rituales"
 tenet_sanctity_of_nature_greek_name: "Fysikí Ierótita"
 tenet_sanctity_of_nature_latin_name: "Sanctitas Naturalis"
 tenet_total_depravity_desc: "Because of Adam's sin, all of humanity is enslaved by sin, and apart from the grace of God, is unable to choose by themselves to refrain from evil or accept salvation."
 tenet_total_depravity_name: "Total Depravity"
 tenet_wedding_ceremonies_base_desc: ", our highest sacrament, unites man with their angel. Our marital ceremonies are likewise elaborate and have significant divine impacts on our salvation."
 tenet_wedding_ceremonies_desc: "$tenet_wedding_ceremonies_name$$tenet_wedding_ceremonies_base_desc$"
 tenet_wedding_ceremonies_greek_desc: "The #italic $tenet_wedding_ceremonies_greek_name$#!$tenet_wedding_ceremonies_base_desc$"
 tenet_wedding_ceremonies_greek_name: "Nymphon"
 tenet_wedding_ceremonies_latin_desc: "The #italic $tenet_wedding_ceremonies_latin_name$#!$tenet_wedding_ceremonies_base_desc$"
 tenet_wedding_ceremonies_latin_name: "Cubicula Nuptialis"
 tenet_wedding_ceremonies_name: "The Bridal Chamber"
