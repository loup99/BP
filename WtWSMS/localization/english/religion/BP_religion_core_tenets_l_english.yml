l_english:
 #New parameters to Doctrines
 doctrine_parameter_increased_subjugation_limit: "$culture_parameter_increased_subjugation_limit$"
 doctrine_parameter_decreased_subjugation_limit: "$culture_parameter_decreased_subjugation_limit$"
 #New stuff for vanilla CK3 tenets
 #Divine Marriage
 tenet_divine_marriage_xwedodah_name: "Xwedodah"
 #Taken the description more from Middle Persian descriptions than Sassanian era sources
 tenet_divine_marriage_xwedodah_desc: "As humanity sprang forth from the consanguineous union of the first humans, Mashya and Mashayana, it is permissible for us to marry our own relations."
 tenet_divine_marriage_abrahamic_desc: "As humanity sprang forth from the consanguineous union of the first humans, Adam and Eve, it is permissible for us to marry our own relations."
 #Literalism (Hellenic)
 tenet_philosophical_name: "Philosophical Origins"
 tenet_philosophical_desc: "Our beliefs grew out not only from mythological texts but philosophical debate. Our adherents value knowledge, debate and reason as well as faith."
 #Polyamory
 tenet_polyamory_christian_name: "Human Frailty"
 tenet_polyamory_christian_desc: "Our love for each other should be as unconditional as [ROOT.Faith.HighGodName]'s love for us. We must always forgive indiscretions of the flesh, even within matrimony, as [ROOT.Faith.HighGodName] forgives us."
 #Harmonious Society
 tenet_harmonious_society_hellenic_name: "Virtue Ethics"
 tenet_harmonious_society_hellenic_desc: "Our beliefs emphasize a well lived life in accordance with nature; Virtue is nothing more than right reason, after all."
 #Righteous Rebirth
 tenet_pure_land_christian_name: "Humble Savior"
 tenet_pure_land_christian_desc: "Christ came, not as a king or conqueror, but in the form of a slave. As his followers, it is well that we emulate his humility."
 ### Abrahamic Tenets
 tenet_autocephaly_name: "Autocephalous Church"
 tenet_autocephaly_desc: "Our #P [ROOT.Faith.MakeScope.Var('church_culture').Culture.GetName]#! church is autocephalous and as such our head bishop does not report to any higher authority. This helps bind us together with a common hierarchy and rite, although it can be somewhat difficult for foreigners to take part in our rituals."
 doctrine_parameter_enables_formation_of_autocephalous_churches: "Enables #V $establish_autocephalous_church_decision$#! Decision for faiths with this [head_of_faith|E] and the $tenet_rite_name$ [core_tenet|E]"
 doctrine_parameter_tenet_autocephaly_same_culture_conversion_bonus_active: "Conversion Speed in counties of [bp_faith_culture|E]: #P +[EmptyScope.ScriptValue('conversion_tenet_autocephaly_same_culture_bonus_value')]%#!\n$EFFECT_LIST_BULLET$Conversion Speed in [bp_faith_child_culture|E] counties: #P +[EmptyScope.ScriptValue('conversion_tenet_autocephaly_child_culture_bonus_value')]%#!\n$EFFECT_LIST_BULLET$Conversion Speed in same [heritage|E] counties: #P +[EmptyScope.ScriptValue('conversion_tenet_autocephaly_same_heritage_bonus_value')]%#!"
 doctrine_parameter_tenet_autocephaly_different_heritage_conversion_malus_active: "Conversion Speed different [heritage|E] counties: #N -[EmptyScope.ScriptValue('conversion_tenet_autocephaly_different_heritage_conversion_malus_value')]%#!"
 doctrine_parameter_tenet_autocephaly_conversion_resistance_active: "Conversion Resistance in [bp_faith_culture|E] and [bp_faith_child_culture|E] counties: #P +[EmptyScope.ScriptValue('conversion_tenet_autocephaly_different_heritage_conversion_resistance_value')]% #!"
 doctrine_parameter_creates_a_new_hof: "Creates a new [head_of_faith|E] upon creation"
 tenet_iconoclasm_name: "Icon Breaking"
 tenet_iconoclasm_desc: "Any image that could become an object of veneration is profane and must be destroyed. Such false idols cannot be allowed to stand!"
 tenet_mountain_hermits_name: "Mountain Hermits"
 tenet_mountain_hermits_desc: "The highest calling is to withdraw from the world and live simply, in imitation of Christ. High in the mountains, we can gaze down at creation and feel the true weight of the divine."
 tenet_frontier_monastics_name: "Frontier Monastics"
 tenet_frontier_monastics_desc: "Living along the outskirts of civilization, we bring the faith to the benighted heathens. While our practices may diverge somewhat, we remain committed to bring the truth to the ignorant."
 doctrine_parameter_organized_conversion_nerfed: "[EmptyScope.ScriptValue('organized_conversion_nerfed_value')|+%0] Conversion Speed of [organized|E] faiths"
 tenet_false_conversion_sanction_african_name: "Render unto Caesar"
 tenet_false_conversion_sanction_african_desc: "We cannot forget the sacrifices that the emperors of old extracted of our early church fathers. Though grave indeed, we must extend penance to those who have lapsed so that His ministry may be rebuilt on Earth."
 doctrine_parameter_lesser_excommunication: "[GetTrait('excommunicated').GetName( GetNullCharacter )] has a reduced [piety|E] and zealot opinion malus"
 tenet_cenobitic_monasticism_name: "Cenobitic Monasticism"
 tenet_cenobitic_monasticism_koinonia_name: "#italic Koinoia#!"
 tenet_cenobitic_monasticism_desc: "A life dedicated to [ROOT.Faith.HighGodNameAlternate] is one that serves as a profound example for [ROOT.Faith.GetAdherentNamePluralNoTooltip]. The path of the [ROOT.Faith.DevoteeNeuter] leads one to draw inwards."
 ### Pagan Tenets
 tenet_unrelenting_warfare_name: "Unceasing Warfare"
 tenet_unrelenting_warfare_desc: "If we remain at peace for too long, it may bring about the end times! As such, we must continually wage war against the infidel."
 doctrine_parameter_gains_piety_raiding_infidels: "Enables raiding, even if not $tribal_government$ or $nomadic_government$\n$EFFECT_LIST_BULLET$Gains #P [EmptyScope.ScriptValue('piety_from_infidel_raiding_multiplier')|2]#! [piety|E] for each loot taken from infidels"
 #Scythians
 scythian_pagan_doctrine_name: ""
 special_doctrine_is_scythian_faith_name: "Scythian Traditions"
 special_doctrine_is_scythian_faith_desc: "This faith is part of the broader Scythian religious milieu."
 doctrine_parameter_utilizes_enarei: "Enables opinion bonus for the [GetTrait('enarei').GetName( GetNullCharacter )] trait"
 ### Syncretism
 #Mazdan Syncretism
 tenet_zoroastrian_syncretism_name: "Zoroastrian Syncretism"
 tenet_zoroastrian_syncretism_desc: "Few prophets of mankind are as ancient and venerable as Zoroaster. Whatever our disagreements with him, we should take heed of his thoughts, words, and deeds."
 doctrine_parameter_hostility_override_special_doctrine_is_zoroastrian_faith: "Considers Zoroastrian [faiths|E] and is considered by Zoroastrian $game_concept_faiths$ to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] instead of $hostility_evil_tooltippable$"
 doctrine_parameter_zoroastrian_syncretic_actor_opinion_active: "Mutual [EmptyScope.ScriptValue('syncretic_mutual_opinion_bonus_value')|=+0] [opinion|E] bonus with Zoroastrian [faiths|E]"
 doctrine_parameter_opinion_of_zoroastrian_syncretic_recipient_opinion_active: ""
 doctrine_parameter_zoroastrian_syncretic_recipient_opinion_active: "Mutual [EmptyScope.ScriptValue('syncretic_mutual_opinion_bonus_value')|=+0] [opinion|E] bonus with [faiths|E] that have the $tenet_zoroastrian_syncretism_name$ [core_tenet|E]"
 doctrine_parameter_opinion_of_zoroastrian_syncretic_actor_opinion_active: ""
 #Hellenism Syncretism
 tenet_hellenic_syncretism_name: "Hellenic Syncretism"
 tenet_hellenic_syncretism_desc: "Although from another land, the legends of the Greco-Roman peoples and the ways of their diviners reflect the underlying reality of the world."
 doctrine_parameter_hostility_override_special_doctrine_is_hellenic_faith: "Considers Hellenic [faiths|E] and is considered by Hellenic $game_concept_faiths$ to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] instead of $hostility_evil_tooltippable$"
 doctrine_parameter_hellenism_syncretic_actor_opinion_active: "Mutual [EmptyScope.ScriptValue('hellenism_syncretic_mutual_opinion_bonus_value')|=+0] [opinion|E] bonus with Hellenic [faiths|E]"
 doctrine_parameter_opinion_of_hellenism_syncretic_recipient_opinion_active: ""
 doctrine_parameter_hellenism_syncretic_recipient_opinion_active: "Mutual [EmptyScope.ScriptValue('hellenism_syncretic_mutual_opinion_bonus_value')|=+0] [opinion|E] bonus with [faiths|E] that have the $tenet_hellenic_syncretism_name$ [core_tenet|E]"
 doctrine_parameter_opinion_of_hellenism_syncretic_actor_opinion_active: ""
 hellenism_syncretic_actor_opinion_active_county_opinion_name: "$faith_syncretic_popular_opinion_active_control$"
 tenet_hellenic_syncretism_pagan_only_name: "$tenet_hellenic_syncretism_name$"
 tenet_hellenic_syncretism_pagan_only_desc: "The universe is vast, and our gods are the gods of the Romans, albeit under different guises."
 #Egyptian Paganism
 tenet_egyptian_syncretism_pagan_only_name: "Egyptian Syncretism"
 tenet_egyptian_syncretism_pagan_only_desc: "Although we are not of the lands of the River, their ways convey deeper truths than other infidel faiths."
 doctrine_parameter_hostility_override_special_doctrine_is_egyptian_faith: "Considers Egyptian [faiths|E] and is considered by Egyptian $game_concept_faiths$ to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] instead of $hostility_hostile_tooltippable$"
 doctrine_parameter_egyptian_syncretic_actor_opinion_active: "Mutual [EmptyScope.ScriptValue('egyptian_syncretic_mutual_opinion_bonus_value')|=+0] [opinion|E] bonus with Egyptian [faiths|E]"
 doctrine_parameter_opinion_of_egyptian_syncretic_recipient_opinion_active: ""
 #Unreformed Syncretism
 tenet_unreformed_syncretism_christian_desc: "As the Apostles went out to all the world to preach the Good News, their message has become slightly distorted among some of the barbarians. But, so long as they remain true to the Good News, these acculturations will surely not impede their salvation."
 