 doctrine_parameter_hostility_override_special_doctrine_alexandria_ecumenism: "Christian [faiths|E] that have the Miaphysite Creed Communion doctrine are considered [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_special_doctrine_nestorian_ecumenism: "Christian [faiths|E] that have the Eastern Creed Communion doctrine are considered [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_special_doctrine_arian_ecumenism: "Christian [faiths|E] that have the Arian Creed doctrine are considered [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
