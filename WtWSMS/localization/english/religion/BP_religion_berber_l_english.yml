 #Berber
 berber_pagan: "Amazighism"
 berber_pagan_adj: "Amazighist"
 berber_pagan_adherent: "Amazighist"
 berber_pagan_adherent_plural: "Amazighist"
 berber_pagan_desc: "Traditional Amazigh beliefs follow the Cult of the Dead, and believe that when one passes from this world, one becomes deified among one's own family. Stone worship and construction of Megaliths bring followers closer to the Gods, with chief deities second only to the Creator being the Sun and Moon Gods. Even among followers of other faiths, syncretism with North African folk tradition is common." # From vanilla, but describes continental Amazigh religion well enough
 
