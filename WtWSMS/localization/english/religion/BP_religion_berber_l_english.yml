 #Msoura
 msoura: "Änti"
 msoura_adj: "Antaean"
 msoura_adherent: "Antaean"
 msoura_adherent_plural: "Antaeans"
 msoura_desc: "Änti is the Tamazight name of the giant Antaeus, an indomitable wrestler who challenged all he met and took their skulls to build a temple to his father, Poseidon. Hercules defeated him by lifting him from the earth, and so the giant was returned to Gaia, his mother, at the site of Msoura. Worshippers venerate Änti and other ancestral leaders at stone circles and burial mounds."
