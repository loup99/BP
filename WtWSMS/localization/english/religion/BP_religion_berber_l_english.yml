 #Gurzil
 gurzil: "Gurzilism"
 gurzil_adj: "Gurzilist"
 gurzil_adherent: "Gurzilist"
 gurzil_adherent_plural: "Gurzilists"
 gurzil_desc: "Inspired by Egyptian esotericism, syncretic practices involving oracular revelations and ancestral worship were fiercely championed by the Libyans and Garamantians. Gurzil, bull-headed son of Amun and a cow, is a wayfinder deity, as much found in the burial-shrouded dead as the bull carried into battle. This fatalistic authority was as much a foundation to a sophisticated society, built on aqueducts and slave labor, as it was to the camel riders of Libya, assured of Gurzil's omens through conquest."
