 assyrian_pagan: "Ashurian"
 assyrian_pagan_adherent: "Ashurian"
 assyrian_pagan_adherent_plural: "Ashurians"
 assyrian_pagan_adj: "Ashurian"
 assyrian_pagan_desc: "Originating from the city state of Assur, the Ashurian faith would spread across Egypt, Babylon and Anatolia following the rise of the Neo-Assyrian Empire in the 10th Century BC. The Ashurians worshiped the god Ashur chiefly but also worshiped other Mesopotamian deities and spirits, as well as personal 'guardian spirits' assigned to individuals by the gods. The King of Assyria is believed to be mortal servant of Ashur sent to enact his will on earth. In Assyrian mythology it is said that if the Assyrians were to stop conquering the world would be brought to an end."
 mesopotamian_faith: "Mesopotamian"
 mesopotamian_faith_adherent: "Mesopotamian"
 mesopotamian_faith_adherent_plural: "Mesopotamians"
 mesopotamian_faith_adj: "Mesopotamian"
 mesopotamian_faith_desc: "The faiths of Mesopotamia eventually coalesced into a general pantheon shared between the civilizations of Sumeria, Akkadia, Assyria, and Babylonia. While all were polytheistic, it had strains of henotheism."
 mesopotamian_pagan: "Anunnakism"
 mesopotamian_pagan_adherent: "Anunnakist"
 mesopotamian_pagan_adherent_plural: "Anunnakists"
 mesopotamian_pagan_adj: "Anunnakist"
 mesopotamian_pagan_desc: "By the Late Antique period, the Mesopotamian religious substrate became generalized under the influence of Hellenization and Persia and came to be shared across all the Semitic cultures of Mesopotamia."
 arabian_pagan: "Arabian Paganism"
 arabian_pagan_adj: "Arabian"
 arabian_pagan_adherent: "Arabian"
 arabian_pagan_adherent_plural: "Arabians"
 arabian_pagan_desc: "The Arabian pagan religion is a diverse belief carried by the nomads of the Arabian desert. Semitic paganism is centred on the worship of natural events such as fire or rain. Many of the Semitic deities are heavily influenced by the Mesopotamian Religions"
