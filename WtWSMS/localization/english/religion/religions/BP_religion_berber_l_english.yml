 african_solar: "Tafuktism"
 african_solar_adherent: "Tafukti"
 african_solar_adherent_plural: "Tafuktis"
 african_solar_adj: "Tafukti"
 african_solar_desc: "The devotees of Tafukt and Ayyur see the sun and moon as mother and father. Created by the primordial witch Settut, they lead humanity from the darkness of the underworld. Settut grew jealous, and trapped the pair in the first eclipse. Only the sacrifice of Settut's own child could free beloved Tafukt, and so burnt offerings to the sun and moon are among the many sacraments performed in their name. Though these gods vary among myths, with Tafukt able to bring drought and Ayyur envious of feminine beauty, followers observe seasonal festivals, water rituals, and the blessing of children to maintain the earth's fertility."
 african_solar_devil_name: "the Darkness"
 african_solar_devil_name_possessive: "the Darkness'"
 african_solar_high_god_name: "Tafukt"
 african_solar_high_god_name_possessive: "Tafukt's"
