 mastimani: "Mastimani"
 mastimani_adherent: "Mastimani"
 mastimani_adherent_plural: "Mastimanis"
 mastimani_adj: "Mastimani"
 mastimani_desc: "The peoples of Roman Africa identified themselves and their deities with the struggle of Jupiter and Saturn. Jupiter represented Roman might as the Numidian war god Mastiman, worshipped at the seats of power. Saturn, the exiled Ancient, bore the complicated legacy of the Phoenicians. Outside the city walls, his distant temples were built on the tophets where Ba'al Hammon once demanded child sacrifice. Empowered under the Severan dynasty, Punic elites popularized Saturn as the astrologer-king Belus, attested by Virgil as the father of Carthage."
