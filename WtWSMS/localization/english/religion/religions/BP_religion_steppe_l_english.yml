l_english:
 scythian_faith: "Scythian Paganism"
 scythian_faith_adj: "Scythian"
 scythian_faith_adherent: "Scythian"
 scythian_faith_adherent_plural: "Scythians"
 scythian_faith_desc: "Scythian Paganism refers to the mythology, ritual practices and beliefs of the Scythians, an ancient Iranian people who dominated Central Asia and the Pontic-Caspian steppe in Eastern Europe throughout Classical Antiquity. What little is known of the religion is drawn from the work of the 5th century Greek historian and ethnographer Herodotus. Scythian religion is assumed to have been related to the earlier Proto-Indo-Iranian religion, and to have influenced later Slavic, Hungarian and Turkic mythologies, as well as some contemporary Eastern Iranian and Ossetian traditions."
 scythian_pagan: "$scythian_faith$"
 scythian_pagan_adj: "$scythian_faith_adj$"
 scythian_pagan_adherent: "$scythian_faith_adherent$"
 scythian_pagan_adherent_plural: "$scythian_faith_adherent_plural$"
 scythian_pagan_desc: "$scythian_faith_desc$"
 sakan_pagan: "Sakan Paganism"
 sakan_pagan_adj: "Sakanist"
 sakan_pagan_adherent: "Sakanist"
 sakan_pagan_adherent_plural: "Sakanists"
 sakan_pagan_desc: "Sakan Paganism refers to the mythology, ritual practices and beliefs of the Sakans, an ancient Iranian people who dominated Central Asia throughout Classical Antiquity. Scythian religion is assumed to have been related to the earlier Proto-Indo-Iranian religion, and to have influenced later Slavic, Hungarian and Turkic mythologies, as well as some contemporary Eastern Iranian and Ossetian traditions."
 sarmatian_pagan: "Sarmatian Paganism"
 sarmatian_pagan_adj: "Sarmatianist"
 sarmatian_pagan_adherent: "Sarmatianist"
 sarmatian_pagan_adherent_plural: "Sarmatianists"
 sarmatian_pagan_desc: "Sarmatian Paganism refers to the mythology, ritual practices and beliefs of the Sarmatians, an ancient Iranian people who dominated the Pontic in Classical Antiquity and early Late Antiquity. Scythian religion is assumed to have been related to the earlier Proto-Indo-Iranian religion, and to have influenced later Slavic, Hungarian and Turkic mythologies, as well as some contemporary Eastern Iranian and Ossetian traditions."
 hunnic_faith: "Hunno-Bolghar Paganism"
 hunnic_faith_adj: "Hunno-Bolghar"
 hunnic_faith_adherent: "Hunno-Bolghar"
 hunnic_faith_adherent_plural: "Hunno-Bolghars"
 hunnic_faith_desc: "The western portion of the Steppe was a great comingling of influences, where the Magyars, Scythians, Bolghars, and Hunnic influences blended together."
 hunnic_pagan: "Hunnish Paganism"
 hunnic_pagan_adj: "Hunnish"
 hunnic_pagan_adherent: "Hunnish"
 hunnic_pagan_adherent_plural: "Hunnics"
 hunnic_pagan_desc: "The poorly attested faith of the Huns, with features based on what is recorded in various annals"
 bolghar_pagan: "Bulgar Paganism"
 bolghar_pagan_adj: "Bulgar"
 bolghar_pagan_adherent: "Bulgar"
 bolghar_pagan_adherent_plural: "Bulgars
 bolghar_pagan_desc: "Bulgar Paganism is the pagan faith of the Bolghar peoples. Similar to the other Steppe faiths in many regards, there is some documentation that hints at a more henotheistic theology than its related faiths."
