l_english:
 bosporan_faith: "Hypsistarian"
 bosporan_faith_adherent: "Hypsistarian"
 bosporan_faith_adherent_plural: "Hypsistarians"
 bosporan_faith_adj: "Hypsistarian"
 bosporan_faith_desc: "Worshipping #italic $bosporan_hypsistos_name$#! (the "Most High" God), this monotheistic faith was found in Asia Minor in the Bosporan Kingdom. While Patristic sources seem to indicate it was a group syncretizing Judaism and paganism, it was nonetheless a distinctly separate tradition from the similarly monotheistic Abrahamic faiths, influenced by Thracians."
 cybelian: "Cybelian Mysteries"
 cybelian_adherent: "Cybelian"
 cybelian_adherent_plural: "Cybelians"
 cybelian_adj: "Cybelian"
 cybelian_desc: "The Cybelian Mysteries were one of the last surviving of the Hellenic Mystery Cults, only being driven from Rome in the beginning of the 5th Century. Cybelian power continued in Africa for many more years."
 hellenism_faith: "Greco-Roman Paganism"
 hellenism_faith_adherent: "Greco-Romanist"
 hellenism_faith_adherent_plural: "Greco-Romanists"
 hellenism_faith_adj: "Greco-Romanist"
 hellenism_faith_desc: "By the Late Antique period, much of the Mediterranean religious systems had been syncretized with and absorbed into the Greco-Roman framework. This proved to be an extremely broad and accommodating religious system, which included influences from regions as far away as Gaul and Egypt, driven by the Roman and Greek 'Translation' of foreign deities into their own religious frameworks."
 helleno_syrian_pagan: "Helleno-Syriac Paganism"
 helleno_syrian_pagan_adherent: "Helleno-Syriac"
 helleno_syrian_pagan_adherent_plural: "Helleno-Syriacs"
 helleno_syrian_pagan_adj: "Helleno-Syriac"
 helleno_syrian_pagan_desc: "With ten conquest of the Persian Empire by Alexander the Great, Hellenistic religion eventually integrated the existing Syrian beliefs, including Atargatis and Elagabalus, into the wider Hellenic belief system."
 mithraic_pagan: "Mithraic Mysteries"
 mithraic_pagan_adherent: "Mithraist"
 mithraic_pagan_adherent_plural: "Mithraists"
 mithraic_pagan_adj: "Mithraic"
 mithraic_pagan_desc: "The Mithraic Mysteries were a mystery religion practised in the Roman Empire from about the 1st to 4th centuries AD. The name of the Persian god Mithra, adapted into Greek as Mithras, was linked to a new and distinctive imagery. Writers of the Roman Empire period referred to this mystery religion by phrases which can be anglicized as Mysteries of Mithras or Mysteries of the Persians. The mysteries were popular in the Roman military. Worshippers of Mithras had a complex system of seven grades of initiation, with ritual meals. Initiates called themselves #italic syndexioi#!, those "united by the handshake". They met in underground temples, which survive in large numbers. The cult appears to have had its center in Rome."
 orphism: "Orphic Mysteries"
 orphism_adherent: "Orphic"
 orphism_adherent_plural: "Orphics"
 orphism_adj: "Orphic"
 orphism_desc: "Orphism is a mystical religion that was said to originate from the mythical hero Orpheus. The Orphics tend to revere more of the Cthonic gods such as Persophone, and Dionysos as the dead and rising aspect. In Orphic belief Humanity has a dual nature, a divine spark(psyche) and a material body (#italic soma#!). In order to achieve salvation from the Titanic, material existence, one had to be initiated into the mysteries and undergo #italic telete#! (ritual purification). In order to maintain their purity following initiation and ritual, Orphics attempt to live an ascetic life free of spiritual contamination."
 platonism: "Platonism"
 platonism_adherent: "Platonist"
 platonism_adherent_plural: "Platonist"
 platonism_adj: "Platonist"
 platonism_desc: "A philosophical system mixing Platonic ideas and oriental mysticism. It holds that all existence consists of emanations from the One with whom the soul may be reunited."
 pythagoreanism: "Pythagoreanism"
 pythagoreanism_adherent: "Pythagorean"
 pythagoreanism_adherent_plural: "Pythagoreans"
 pythagoreanism_adj: "Pythagorean"
 pythagoreanism_desc: "Pythagoreanism originated in the 6th century BC, based on the teachings and beliefs held by Pythagoras and his followers, the Pythagoreans. Rather uniquely, it encouraged equality between men and women, emphasized reincarnation via the transmigration of souls, and numerology."
 roman_pagan: "Roman Paganism"
 roman_pagan_adherent: "Romanist"
 roman_pagan_adherent_plural: "Romanists"
 roman_pagan_adj: "Romanist"
 roman_pagan_desc: "The Romans worshiped a Pantheon of deities and their practices consisted of a number of inherited customs borrow from the Etruscans, and the Greeks. Emphasizing tradition and orthopraxis over belief, the Roman tradition syncretized readily with Gallic, Punic, Syrian traditions as Roman conquests expanded."
 romano_celtic_pagan: "Gallic Paganism"
 romano_celtic_pagan_adherent: "Gallic Pagan"
 romano_celtic_pagan_adherent_plural: "Gallic Pagans"
 romano_celtic_pagan_adj: "Gallic Pagan"
 romano_celtic_pagan_desc: "Gallic paganism changed significantly under Roman auspices, acquiring a number of practices from their Latin rulers. While still distinct from the imperial cult and recognizable somewhat to the followers of the old ways, by the late IVth Century Gallic paganism had become a syncretic mix of Roman, Vasconic, Germanic, and native practices."
 sol_invictus: "Sol Invictus"
 sol_invictus_adherent: "Sol Invictus"
 sol_invictus_adherent_plural: "Sol Invictus"
 sol_invictus_adj: "Sol Invictus"
 sol_invictus_desc: "Solar worship in the Roman world was began in 274 when the Roman emperor Aurelian made the cult of Sol Invictus, "The Unconquered Sun" a official cult alongside the traditional Roman cults. The Sol Invictus cult was favored by emperors after Aurelian and appeared on their coins until Constantine."
 stoicism: "Stoicism"
 stoicism_adherent: "Stoic"
 stoicism_adherent_plural: "Stoics"
 stoicism_adj: "Stoic"
 stoicism_desc: "Stoicism is a school of Hellenistic philosophy founded by Zeno of Citium in Athens in the early 3rd century BC. It is a philosophy of personal ethics informed by its system of logic and its views on the natural world. According to its teachings, as social beings, the path to #italic eudaimonia#! (happiness, or blessedness) is found in accepting the moment as it presents itself, by not allowing oneself to be controlled by the desire for pleasure or fear of pain, by using one's mind to understand the world and to do one's part in nature's plan, and by working together and treating others fairly and justly."
