l_english:
 ebionite: "Ebionite"
 ebionite_adherent: "Ebionite"
 ebionite_adherent_plural: "Ebionites"
 ebionite_adj: "Ebionite"
 ebionite_desc: "Ebionites, or Ebionaioi, is a patristic term referring to a Jewish Christian movement that existed during the early centuries of the Christian Era. They regarded Jesus of Nazareth as the Messiah while rejecting his divinity and insisted on the necessity of following Jewish law and rites. The Ebionites used only one of the Jewish Gospels, revered James the Just and rejected Paul of Tarsus as an apostate from the Law. Their name suggests that they placed a special value on voluntary poverty. They have been identified as the meek and the poor Jesus spoke of in the Beatitudes, and the Ebionim was one of the terms used by the sect that sought to separate themselves from the corruption of the Temple, at Qumran, whom many believe were the Essenes."
 elcesaite: "Elcesaite"
 elcesaite_adherent: "Elcesaite"
 elcesaite_adherent_plural: "Elcesaites"
 elcesaite_adj: "Elcesaite"
 elcesaite_desc: "The Elcesaites were a Jewish Christian sect from the IInd to the Vth Centuries, which originated in the Levant and flourish on the outskirts of Asoristan. A blend of Essene, Christian, Jewish, and apocalyptic mysticism, it had a distinctly Gnostic soteriology, and likely intermixed with the early Mandeans, as the group practiced frequent baptisms as a means of purification."
 himyarite_judaism: "Rahmananism"
 himyarite_judaism_adherent: "Rahmananist"
 himyarite_judaism_adherent_plural: "Rahmananists"
 himyarite_judaism_adj: "Rahmananist"
 himyarite_judaism_desc: "During the IVth Century, the Himyarite Kingdom adopted Judaism, or at least a Judaic-influenced Monotheism, as the state faith, as evinced by a disappearance of references to Pagan deities. The most common reference was to #italic Rahmanan#! (the Merciful) as well as Jewish appellations for the singular deity. "
 tzadikite: "Tzadikite"
 tzadikite_adherent: "Tzadikite"
 tzadikite_adherent_plural: "Tzadikites"
 tzadikite_adj: "Tzadikite"
 tzadikite_desc: "#italic Tzadikite#!, meaning 'righteous one', represents the mystical and Kabbalistic form of Judaism practiced mainly by the Juhuri people in the Caucasian Mountains. Highly militaristic, this form of Judaism is centered on martial prowess and skill."
 bavlim_judaism: "Bavlimism"
 bavlim_judaism_adj: "Bavlimist"
 bavlim_judaism_adherent: "Bavlimist"
 bavlim_judaism_adherent_plural: "Bavlimists"
 bavlim_judaism_desc: "Judaism in Mesopotamia has a long history, tracing back to the Babylonian exile. While these #italic Yəhūdīm Bābəlīm#! are very similar to the other Rabbinic Jews, during the Late Antique and into the Medieval period, they were organized under the #italic R'ōš ha-gôlā#!, who functioned as the #italic de facto#! religious head of Jews in Asoristan."
