l_english:
 iranian_pagan: "Mehrism" # Dar = Tree # Kutayeism - Kutaye
 iranian_pagan_adj: "Mehrist"
 iranian_pagan_adherent: "Mehrist"
 iranian_pagan_adherent_plural: "Mehrists"
 iranian_pagan_desc: "The Northwest Iranians' old religious beliefs are related to but distinct from orthodox Zoroastrianism, which it may have coexisted during the Sassanids' heyday. Veneration of nature is prominent, and the old Iranian deity Mithra, or Mehr, plays an key cosmological role as the demiurge and common object of worship – a role that might have inspired the Roman Cult of Mithras centuries before."
 iranian_pagan_holy_text: "$kurdish_pagan_religious_text$"
