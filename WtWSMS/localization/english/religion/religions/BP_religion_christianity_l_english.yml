l_english:
 african_church: "African Rite"
 african_church_adherent: "African"
 african_church_adherent_plural: "Africans"
 african_church_adj: "African"
 african_church_desc: "The Early Christian Church did not have the same precise rubrics seen in later centuries, and a number of concurrent rites developed across the Roman Empire. While these rites were in doctrinal agreement with one another, it led to some noticeable behavioral and structural differences between the many rites in the East and West.\n\nIn North Africa, the African Rite was one such rite. In the face of infidel oppression and internal disagreements (such as those that culminated in the Council of Carthage in AD 412), it retains a more fundamentalist and legalistic approach to doctrine in the face of such challenges."
 albanian_apostolic: "Elysean Rite"
 albanian_apostolic_adherent: "Elysean"
 albanian_apostolic_adherent_plural: "Elysean"
 albanian_apostolic_adj: "Elysean"
 albanian_apostolic_desc: "The Early Christian Church did not have the same precise rubrics seen in later centuries, and a number of concurrent rites developed across the Roman Empire. While these rites were in doctrinal agreement with one another, it led to some noticeable behavioral and structural differences between the many rites in the East and West.\n\nIn [Glossary('Aghwank','AGHWANK_GLOSS')], the Elysean Church was one such example. Traditionally held to have been established by Saint Ełišay in the Ist Century, it was formally established when Urnayr I converted to Christianity, being the national church of Caucasian Albania."
 antenicene_christianity: "Ante-Nicene Christianity"
 antenicene_christianity_adj: "Ante-Nicene Christian"
 antenicene_christianity_desc: "Ante-Nicene Christianity refers to the period following the Apostolic period, wherein Christianity began to more closely resemble the Nicene Church. While it was far more disorganized than the later Nicene Church, the proto-orthodox strains were already apparent as early as the IInd Century and eventually came to dominate the Christian world. Several Christian faiths splintered from the proto-orthodox Christian faith at this time, including Marcionism."
 apostolic_christianity: "Apostolic Christianity"
 apostolic_christianity_adj: "Apostolic Christian"
 apostolic_christianity_desc: "The Apostolic Age is the earliest period of Christianity, starting with Christ's Crucifixion and ending with the death of the last Apostle, John, circa AD 100. All Christian faiths claim descent from this rite, and thus view it as righteous. To maintain neutrality, in $wtwsms_italic$, we have elected to have it view all Christian faiths as astray. This approach allows us to make as few inferences and political decisions as possible."
 appelianism: "Appelianism"
 appelianism_adherent: "Appelianist"
 appelianism_adherent_plural: "Appelianists"
 appelianism_adj: "Appelianist"
 appelianism_desc: "The Appelianist school of Marconism, as revealed to Apellius through through the woman Philumene, the Apellian school preaches a single principle and Patristic sources stated that they had many beliefs in common with the Ante-Nicene Church."
 aquileianism: "Aquileianism"
 aquileianism_adherent: "Aquileian"
 aquileianism_adherent_plural: "Aquileian"
 aquileianism_adj: "Aquileian"
 aquileianism_desc: "The Holy See of Aquilea, together with other northern Italian bishops split from the church in Rome in 553 from the disagreement regarding the 2nd Council of Constantinople, attempting to reconcile western and middle-eastern Christian views on the nature of Christ. They proclaimed a Patriarch in Aquilea, thus beginning what would be known as the "Schism of the Three Chapters"."
 arian: "Arianism"
 arian_adherent: "Arian"
 arian_adherent_plural: "Arians"
 arian_adj: "Arian"
 arian_desc: "Denial of the true divinity of Jesus Christ taking various specific forms, but all agreed that Jesus Christ was created by the Father, that he had a beginning in time, and that the title "Son of God" was a courtesy one. Arius, a third-century Christian priest in Alexandria, is considered to be the main theologian behind Arian teachings. The agitation Arianism caused amongst Early Christianity led to the council of Nicea in 325 which defined the nature of the Father and Son and declared the doctrine to be heretical, and further reinforced at the Council of Constantinople in 381.\n\nSpread through missionaries to various Germanic peoples who re-imported it across the West with their implementations, Arianism would remain a competing church against mainstream Christianity, albeit one strongly tied to the Germanic identity."
 audianism: "Audianism"
 audianism_adherent: "Audianist"
 audianism_adherent_plural: "Audianists"
 audianism_adj: "Audianistic"
 audianism_desc: "Belief named after Audius which believed that God has human form (anthropomorphism) and that one ought to celebrate Jesus' death during the Jewish Passover."
 donatism: "Donatism"
 donatism_adherent: "Donatist"
 donatism_adherent_plural: "Donatists"
 donatism_adj: "Donatist"
 donatism_desc: "Donatists were rigorists, holding that the church must be a church of \"saints\", not \"sinners\", and that sacraments, such as baptism, administered by #italic Traditores#! (\"traitors\", sinful, traitorous clergy) were invalid. Probably in 311 AD, a new bishop of Carthage, Caecilian, was consecrated by someone who had allegedly been a Traditor, Felix of Aptungi, his opponents consecrated a short-lived rival, who was succeeded by Donatus, after whom the schism was named. In 313, a commission appointed by Pope Miltiades fought against the Donatists, but they continued to exist, viewing themselves, and not the Nicene Church, as the \"true Church\", the only one with \"valid sacraments\""
 gallican_church: "Gallican Rite"
 gallican_church_adherent: "Gallican"
 gallican_church_adherent_plural: "Gallicans"
 gallican_church_adj: "Gallican"
 gallican_church_desc: "The Early Christian Church did not have the same precise rubrics seen in later centuries, and a number of concurrent rites developed across the Roman Empire. While these rites were in doctrinal agreement with one another, it led to some noticeable behavioral and structural differences between the many rites in the East and West.\n\nIn Gaul, the Gallican Rite was one such rite. Closely related too, but distinct from, the Hispanic Rite, it was dominant in Gaul in 476."
 gothic_rite: "Gothic Rite"
 gothic_rite_adherent: "Gothic Christian"
 gothic_rite_adherent_plural: "Gothic Christians"
 gothic_rite_adj: "Gothic"
 gothic_rite_desc: "The Gothic rite is the liturgical tradition of the Gothic (and other East Germanic) Christians, shaped by the translation of the Bible into Gothic by Ulfias, a Gothic preacher of Cappadocian descent. The Goths embraced a subordinationist Christology in contrast to the greater Roman Church, along with some of their own customs."
 marcionism_faith: "Marcionism"
 marcionism_faith_adherent: "Marcionist"
 marcionism_faith_adherent_plural: "Marcionists"
 marcionism_faith_adj: "Marcionist"
 marcionism_faith_desc: "Marcionism was an Early Christian dualist belief system that originated in the teachings of Marcion of Sinope at Rome around the year 144 AD. Marcion believed Jesus Christ was the savior sent by God, and Paul of Tarsus was his chief apostle, but he rejected the Hebrew Bible and the God of Israel. Marcionists believed that the wrathful Hebrew God was a separate and lower entity than the all-forgiving God of the New Testament. This belief was in some ways similar to Gnostic Christian theology. Notably, both are dualistic, that is, they posit opposing gods, forces, or principles; one higher, spiritual, and 'good', and the other lower, material, and 'evil' (compare Manicheanism), in contrast to the orthodox Christian view that 'evil' has no independent existence, but is a privation or lack of 'good', a view shared by the Jewish theologian Moses Maimonides."
 maronite_church: "Maronite Church"
 maronite_church_adherent: "Maronite"
 maronite_church_adherent_plural: "Maronites"
 maronite_church_adj: "Maronite"
 maronite_church_desc: "The Early Christian Church did not have the same precise rubrics seen in later centuries, and a number of concurrent rites developed across the Roman Empire. While these rites were in doctrinal agreement with one another, it led to some noticeable behavioral and structural differences between the many rites in the East and West.\n\nIn Phoenicia, the Maronite Church was one such example. While utilizing the Western Syriac Rite, they remain steadfastly loyal to the Chalcedonian Creed and the Imperial Church, in contrast to the greater Western Syriac Church."
 melchisdechianism: "Melchisdechianism"
 melchisdechianism_adherent: "Melchisdechian"
 melchisdechianism_adherent_plural: "Melchisdechians"
 melchisdechianism_adj: "Melchisdechian"
 melchisdechianism_desc: "Melchisedechianism is a mysticist Christian sect that considers Melchisedech (or Malchizedek), the Priest-King of Salem, an incarnation of the Logos and identified him with the Holy Ghost. They held that the Sabbath was the holiest of days and gifted food must be placed on the ground, and then picked up by the recipient. Melchisedechians consider parts of Genesis to be "Logia Melchizedek", that is, Melchizedek's Sayings, and hold that Melchizedek established a parallel, spiritual priesthood that was truly formed by his later incarnation as Jesus, in His role as High Priest In the Order of Melchizedek. Most of what is known about the Melchisedechian sect is found in Gnostic books and documents and a Catholic rebuttal text called "Against the Melchisedekites". The Melchisedechian Eucharist uniquely featured both the presence of fans and of a central flame, where the holy bread was deposited at the end of the ritual."
 miaphysitism_faith: "Miaphysitism"
 miaphysitism_faith_adherent: "Miaphysite"
 miaphysitism_faith_adherent_plural: "Miaphysites"
 miaphysitism_faith_adj: "Miaphysite"
 miaphysitism_faith_desc: "At the Council of Chalcedon, the formulation of Christ's nature was viewed as overly Nestorian and caused a schism over that formulation. The churches of Armenia and Georgia, and the peoples of Syria and Egypt, rejected the Chalcedon Formulation, proving to be the first great break in the Great Church."
 montanism: "Montanism"
 montanism_adherent: "Montanist"
 montanism_adherent_plural: "Montanists"
 montanism_adj: "Montanist"
 montanism_desc: "Montanism was an early Christian movement of the late 2nd century, later referred to by the name of its founder, Montanus. It is a prophetic movement that calls for a reliance on the spontaneity of the Holy Spirit and a more conservative personal ethic."
 nasrani: "Nasrani Rite"
 nasrani_adherent: "Nasrani"
 nasrani_adherent_plural: "Nasrani"
 nasrani_adj: "Nasrani"
 nasrani_desc: "Christianity reached western India, in the Malabar region, in AD 52 when, according to Tradition, Thomas the Apostle came to Muziris to preach. By the Vth Century, there was a thriving community of Christians in communion with the Sea of Seleucia-Ctesiphon."
 nazarene: "Nazarenes"
 nazarene_adherent: "Nazarene"
 nazarene_adherent_plural: "Nazarenes"
 nazarene_adj: "Nazarene"
 nazarene_desc: "The Nazarenes were an early Jewish Christian sect from the First to the Fifth Century. They continued to observe the Torah in contrast to proto-Orthodox and later Nicene Church. They were distinguished from other Jewish Christian sects like the Ebionites by Patristic polemics, such as the #italic Panarion#!.\n\nUnlike the Ebionites, the distinction of the Nazarenes beliefs from orthodoxy was less certain, except that they maintained Jewish customs against the norms of the wider Christian church."
 nestorian_faith: "Trenkyanism"
 nestorian_faith_adherent: "Trenkyanite"
 nestorian_faith_adherent_plural: "Trenkyanites"
 nestorian_faith_adj: "Trenkyanite"
 nestorian_faith_desc: "At the Council of Ephesus, Nestorius' formulation of the nature of Christ was condemned. In the East, however, long separated from Rome, the Assyrians and Chaldeans reached a separate formula:  Lord Jesus Christ, the Word and Son of God, there exists one Parṣōpā, there are two natures (Trēn Kyānē) and two concrete instances  and realities (Trēn Qnōmē) of the two natures, in one person (Ḥdā Parṣōpā) in Christ. This formulation, while natural in Syriac, was found insufficient and later condemned.\n\nThe neologism 'Trenkeyaneism' helps avoid the partisan nature of the histographical term 'Nestorian', which never accurately reflected the views of the Church of the East; it is meant to be a close synonym to the Greek Term 'Dyophysite'."
 nestorian_rite: "Assyriac Rite"
 nestorian_rite_adherent: "Assyriac"
 nestorian_rite_adherent_plural: "Assyriacs"
 nestorian_rite_adj: "Assyriac"
 nestorian_rite_desc: "The Christian Assyrians and Chaldeans outside the Roman Empire have schismed from the Roman Church during the Christological disputes at the Council of Ephesus. Their Christological formulation, while similar to the Roman Church's Dyophysitism, is expressed in a different manner than the Greek Dyophysite, which some believe have strong theological implications."
 pelagianism: "Pelagianism"
 pelagianism_adherent: "Pelagian"
 pelagianism_adherent_plural: "Pelagians"
 pelagianism_adj: "Pelagian"
 pelagianism_desc: "Pelagianism is the belief that original sin did not taint human nature and that mortal will is still capable of choosing good or evil without special Divine aid. This is still sometimes called Limited Depravity. Thus, in contrast to 1 Corinthians 15:19-22, Adam's sin was \"to set a bad example\" for his progeny, but his actions did not have the other consequences imputed to original sin. Pelagianism views the role of Jesus as \"setting a good example\" for the rest of humanity as well as providing an atonement for our sins. In short, humanity has full control, and thus full responsibility, for obeying the Gospel in addition to full responsibility for every sin. According to Pelagian doctrine, because humans are sinners by choice, they are therefore criminals who need the atonement of Jesus Christ. Sinners are not victims, they are criminals who need pardon."
 pneumatomachianism: "Pneumatomachianism"
 pneumatomachianism_adherent: "Pneumatomachi"
 pneumatomachianism_adherent_plural: "Pneumatomachi"
 pneumatomachianism_adj: "Pneumatomachi"
 pneumatomachianism_desc: "While accepting the divinity of Jesus Christ as affirmed at Nicaea in 325, they denied that of the Holy Spirit which they saw as a creation of the Son, and a servant of the Father and the Son."
 potitianism: "Potitianism"
 potitianism_adherent: "Potitianist"
 potitianism_adherent_plural: "Potitianists"
 potitianism_adj: "Potitianist"
 potitianism_desc: "The Potitianist school of Marcnionist Theology is the “Orthodox” branch of Marcionism, centered on a fine line between Gnosticism and Christianity."
 rogatism: "Rogatism"
 rogatism_adherent: "Rogatist"
 rogatism_adherent_plural: "Rogatists"
 rogatism_adj: "Rogatist"
 rogatism_desc: "A branch of the Rigorist movement in Africa, the Rogatists deplored violence in all forms and argued that none should be forced to embrace righteousness. The movement died out sometime in the Vth Century AD."
 synerianism: "Synerianism"
 synerianism_adherent: "Synerianist"
 synerianism_adherent_plural: "Synerianists"
 synerianism_adj: "Synerianist"
 synerianism_desc: "The Synerianist school of Marconism, as revealed by Syneros, preaches a doctrine of three natures, likely meaning influences from Gnostic or Mazdan sources."
 tascodrugites: "Tascodrugitism"
 tascodrugites_adherent: "Tascodrugite"
 tascodrugites_adherent_plural: "Tascodrugites"
 tascodrugites_adj: "Tascodrugite"
 tascodrugites_desc: "A certain sect active in Galatia in the IVth and Vth Centuries, and possibly as late as the IXth, the Tascodrugites were likely a branch of the Montanist movement. Different Patristic sources describe their practices differently, either as Gnostic or a late expression of Quintillianism. Their name indicates a potential link with the Celtic language, and were likely part of the broad diversity of Christian faiths that found practice in Asia Minor in the first centuries AD."
