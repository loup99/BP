 western_manichean_adherent: "Adimantist"
 western_manichean_adherent_plural: "Adimantists"
 western_manichean_adj: "Adimantist"
 western_manichean_desc: "In the West, Manichaeism took on a more explicitly Christian character. One of its greatest proponents, Adimantus, was a contemporary of Augustine and played a major role in the rise of Manichaeism in Europe."
