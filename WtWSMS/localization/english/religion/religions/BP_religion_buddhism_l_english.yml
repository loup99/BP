l_english:
 dharmaguptaka: "Dharmaguptaka"
 dharmaguptaka_adherent: "Dharmaguptakan"
 dharmaguptaka_adherent_plural: "Dharmaguptakans"
 dharmaguptaka_adj: "Dharmaguptakan"
 dharmaguptaka_desc: "The path of the #italic śrāvaka#! (disciple) and the path of the bodhisattva are separate, and the Four Noble Truths must be observed simultaneously."
 mahasamghika: "Mahasamghika"
 mahasamghika_adherent: "Mahasamghikan"
 mahasamghika_adherent_plural: "Mahasamghikans"
 mahasamghika_adj: "Mahasamghikan"
 mahasamghika_desc: "The Buddhas possess a #italic lokottara#! (supramundane) nature and free from #italic asravas#! (defilements), and there are no #italic avyakrta#! (indeterminate) dharmas."
 nikaya_faith: "Nikaya"
 nikaya_faith_adherent: "Nikayan"
 nikaya_faith_adherent_plural: "Nikayans"
 nikaya_faith_adj: "Nikayan"
 nikaya_faith_desc: "Nikaya is a modern term for several early schools of Buddhism, including $mahasamghika$ and $sarvastivada$, which varied in their practices and canons."
 sarvastivada: "Sarvastivada"
 sarvastivada_adherent: "Sarvastivadan"
 sarvastivada_adherent_plural: "Sarvastivadans"
 sarvastivada_adj: "Sarvastivadan"
 sarvastivada_desc: "All the dharmas exist in the past, present, and future. We focus on the causation and conditionality of events, and that which links all events."
 